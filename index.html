    <style>
        /* ===== CSS Variables ===== */
        :root {
            --md-sys-color-primary: #DB6B46;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #FFFFFF;
            --md-sys-color-on-primary-container: #DB6B46;
            --md-sys-color-secondary: #5C4B3E;
            --md-sys-color-on-secondary: #FFFFFF;
            --md-sys-color-secondary-container: #E6DCD6;
            --md-sys-color-on-secondary-container: #3D2F26;
            --md-sys-color-tertiary: #5A6B5A;
            --md-sys-color-on-tertiary: #FFFFFF;
            --md-sys-color-tertiary-container: #DDF2DD;
            --md-sys-color-on-tertiary-container: #3D4F3D;
            --md-sys-color-surface: #FEFAE0;
            --md-sys-color-surface-dim: #E5E1C9;
            --md-sys-color-surface-bright: #FEFAE0;
            --md-sys-color-surface-container: #F5F1D7;
            --md-sys-color-surface-container-high: #EFEBD1;
            --md-sys-color-surface-container-highest: #E9E5CB;
            --md-sys-color-surface-container-low: #FBF7DD;
            --md-sys-color-surface-container-lowest: #FFFFFF;
            --md-sys-color-on-surface: #1C1A12;
            --md-sys-color-on-surface-variant: #4D473D;
            --md-sys-color-outline: #7D776C;
            --md-sys-color-outline-variant: #CBC5B8;
            --md-sys-color-inverse-surface: #2F2D25;
            --md-sys-color-inverse-on-surface: #F5F1E7;
            --md-sys-color-error: #BA1A1A;
            --md-sys-color-on-error: #FFFFFF;
            --md-sys-color-error-container: #FFDAD6;
            --md-sys-color-on-error-container: #93000A;
            --md-sys-color-scrim: #000000;
            --md-elevation-level1: 0 1px 3px 0 rgba(0,0,0,0.10);
            --md-elevation-level2: 0 3px 6px rgba(0,0,0,0.14);
            --md-elevation-level3: 0 10px 20px rgba(0,0,0,0.17);
            --md-ref-typeface-brand: 'Prompt', sans-serif;
            --md-ref-typeface-plain: 'Nunito Sans', system-ui, sans-serif;
            --md-ref-typeface-mono: 'Roboto Mono', monospace;
            --glass-backdrop-blur: blur(20px);
            --motion-easing-emphasized: cubic-bezier(0.2,0.0,0.0,1.0);
            --motion-duration-medium: 300ms;
            color-scheme: light;
            --sidebar-width: 300px;
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --input-area-bottom: 16px;
            --header-height: 52px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --md-sys-color-surface: #000000;
                --md-sys-color-surface-dim: #000000;
                --md-sys-color-surface-bright: #2A2A2A;
                --md-sys-color-surface-container: #141414;
                --md-sys-color-surface-container-high: #1E1E1E;
                --md-sys-color-surface-container-highest: #292929;
                --md-sys-color-surface-container-low: #0A0A0A;
                --md-sys-color-surface-container-lowest: #000000;
                --md-sys-color-on-surface: #E8E4DA;
                --md-sys-color-on-surface-variant: #CBC5B8;
                --md-sys-color-outline: #948E82;
                --md-sys-color-outline-variant: #4D473D;
                --md-sys-color-inverse-surface: #E8E4DA;
                --md-sys-color-inverse-on-surface: #2F2D25;
                --md-sys-color-primary-container: #FFFFFF;
                --md-sys-color-on-primary-container: #DB6B46;
                --md-sys-color-secondary-container: #3D2F26;
                --md-sys-color-on-secondary-container: #E6DCD6;
                --md-sys-color-tertiary-container: #3D4F3D;
                --md-sys-color-on-tertiary-container: #DDF2DD;
                --md-sys-color-error: #FFB4AB;
                --md-sys-color-on-error: #690005;
                --md-sys-color-error-container: #93000A;
                --md-sys-color-on-error-container: #FFDAD6;
                --md-sys-color-scrim: #000000;
                --md-elevation-level1: 0 1px 3px 0 rgba(0,0,0,0.5);
                --md-elevation-level2: 0 3px 6px rgba(0,0,0,0.6);
                --md-elevation-level3: 0 10px 20px rgba(0,0,0,0.7);
                color-scheme: dark;
            }
        }
        .theme-dark {
            --md-sys-color-surface: #000000;
            --md-sys-color-surface-dim: #000000;
            --md-sys-color-surface-bright: #2A2A2A;
            --md-sys-color-surface-container: #141414;
            --md-sys-color-surface-container-high: #1E1E1E;
            --md-sys-color-surface-container-highest: #292929;
            --md-sys-color-surface-container-low: #0A0A0A;
            --md-sys-color-surface-container-lowest: #000000;
            --md-sys-color-on-surface: #E8E4DA;
            --md-sys-color-on-surface-variant: #CBC5B8;
            --md-sys-color-outline: #948E82;
            --md-sys-color-outline-variant: #4D473D;
            --md-sys-color-inverse-surface: #E8E4DA;
            --md-sys-color-inverse-on-surface: #2F2D25;
            --md-sys-color-primary-container: #FFFFFF;
            --md-sys-color-on-primary-container: #DB6B46;
            --md-sys-color-secondary-container: #3D2F26;
            --md-sys-color-on-secondary-container: #E6DCD6;
            --md-sys-color-tertiary-container: #3D4F3D;
            --md-sys-color-on-tertiary-container: #DDF2DD;
            --md-sys-color-error: #FFB4AB;
            --md-sys-color-on-error: #690005;
            --md-sys-color-error-container: #93000A;
            --md-sys-color-on-error-container: #FFDAD6;
            --md-sys-color-scrim: #000000;
            --md-elevation-level1: 0 1px 3px 0 rgba(0,0,0,0.5);
            --md-elevation-level2: 0 3px 6px rgba(0,0,0,0.6);
            --md-elevation-level3: 0 10px 20px rgba(0,0,0,0.7);
            color-scheme: dark;
        }
        .theme-light {
            --md-sys-color-surface: #FEFAE0;
            --md-sys-color-surface-dim: #E5E1C9;
            --md-sys-color-surface-bright: #FEFAE0;
            --md-sys-color-surface-container: #F5F1D7;
            --md-sys-color-surface-container-high: #EFEBD1;
            --md-sys-color-surface-container-highest: #E9E5CB;
            --md-sys-color-surface-container-low: #FBF7DD;
            --md-sys-color-surface-container-lowest: #FFFFFF;
            --md-sys-color-on-surface: #1C1A12;
            --md-sys-color-on-surface-variant: #4D473D;
            --md-sys-color-outline: #7D776C;
            --md-sys-color-outline-variant: #CBC5B8;
            --md-sys-color-inverse-surface: #2F2D25;
            --md-sys-color-inverse-on-surface: #F5F1E7;
            --md-sys-color-primary-container: #FFFFFF;
            --md-sys-color-on-primary-container: #DB6B46;
            --md-sys-color-secondary-container: #E6DCD6;
            --md-sys-color-on-secondary-container: #3D2F26;
            --md-sys-color-tertiary-container: #DDF2DD;
            --md-sys-color-on-tertiary-container: #3D4F3D;
            --md-sys-color-error: #BA1A1A;
            --md-sys-color-on-error: #FFFFFF;
            --md-sys-color-error-container: #FFDAD6;
            --md-sys-color-on-error-container: #93000A;
            --md-sys-color-scrim: #000000;
            --md-elevation-level1: 0 1px 3px 0 rgba(0,0,0,0.10);
            --md-elevation-level2: 0 3px 6px rgba(0,0,0,0.14);
            --md-elevation-level3: 0 10px 20px rgba(0,0,0,0.17);
            color-scheme: light;
        }
        /* ===== Reset & Base ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: var(--md-ref-typeface-plain);
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            display: flex;
            flex-direction: column;
            transition: background-color var(--motion-duration-medium) var(--motion-easing-emphasized);
            position: relative;
        }
        /* ===== Background Layers ===== */
        #particleCanvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #particleCanvas.active { opacity: 1; }
        #bgAnimationContainer {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            transition: background 0.8s ease;
        }
        #svgBackground {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            display: none;
        }
        #svgBackground.active { display: block; }
        #svgBackground svg { width: 100%; height: 100%; display: block; }
        /* ===== App Wrapper ===== */
        .app-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: transparent;
        }
        /* ===== Header ===== */
        .header {
            padding: 8px 16px;
            height: var(--header-height);
            min-height: var(--header-height);
            background: var(--md-sys-color-surface-container);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: var(--glass-backdrop-blur);
            -webkit-backdrop-filter: var(--glass-backdrop-blur);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            transition: all var(--motion-duration-medium) var(--motion-easing-emphasized);
            flex-shrink: 0;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .logo-icon {
            width: 32px; height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .header .logo-icon img {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 8px;
        }
        .header-title {
            font-family: var(--md-ref-typeface-brand);
            font-style: italic;
            font-weight: 600;
            color: var(--md-sys-color-primary);
            font-size: 1.2rem;
            letter-spacing: -0.02em;
            transition: color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .sidebar-toggle {
            background: transparent;
            color: var(--md-sys-color-on-surface-variant);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .sidebar-toggle:hover {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            transform: scale(1.05);
        }
        .sidebar-toggle:active { transform: scale(0.95); }
        .sidebar-toggle .lucide {
            width: 22px; height: 22px;
            stroke-width: 1.8;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-toggle {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--motion-duration-medium) var(--motion-easing-emphasized);
            box-shadow: var(--md-elevation-level1);
        }
        .theme-toggle:hover {
            transform: scale(1.06) rotate(6deg);
            box-shadow: var(--md-elevation-level2);
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }
        .theme-toggle:active { transform: scale(0.95); }
        .theme-toggle .lucide {
            width: 20px; height: 20px;
            stroke-width: 1.8;
            transition: transform var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        /* ===== Sidebar ===== */
        .sidebar-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
        .sidebar {
            position: fixed; top: 0; left: 0;
            width: var(--sidebar-width);
            max-width: 85vw;
            height: 100%;
            background: var(--md-sys-color-surface-container);
            z-index: 201;
            transform: translateX(-100%);
            transition: transform var(--motion-duration-medium) var(--motion-easing-emphasized);
            box-shadow: var(--md-elevation-level3);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--md-sys-color-outline-variant);
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            flex-shrink: 0;
            min-height: 54px;
        }
        .sidebar-header h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--md-sys-color-on-surface);
            font-family: var(--md-ref-typeface-plain);
            transition: color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .sidebar-close {
            background: transparent;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .sidebar-close:hover { background: var(--md-sys-color-surface-container-high); }
        .sidebar-close .lucide { width: 20px; height: 20px; stroke-width: 1.8; }
        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px 16px;
        }
        .sidebar-body::-webkit-scrollbar { width: 4px; }
        .sidebar-body::-webkit-scrollbar-track { background: transparent; }
        .sidebar-body::-webkit-scrollbar-thumb {
            background: var(--md-sys-color-outline-variant);
            border-radius: 4px;
        }
        .new-chat-btn {
            width: 100%;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1.5px dashed var(--md-sys-color-outline);
            background: transparent;
            color: var(--md-sys-color-on-surface);
            font-size: 0.9rem;
            font-weight: 500;
            font-family: var(--md-ref-typeface-plain);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .new-chat-btn:hover {
            background: var(--md-sys-color-primary-container);
            border-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary-container);
        }
        .new-chat-btn .lucide { width: 20px; height: 20px; stroke-width: 1.8; }
        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-list-empty {
            text-align: center;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 0.9rem;
            padding: 40px 10px;
            line-height: 1.6;
            transition: color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            border: 1px solid transparent;
        }
        .chat-item:hover { background: var(--md-sys-color-surface-container-high); }
        .chat-item.active {
            background: var(--md-sys-color-primary-container);
            border-color: var(--md-sys-color-primary);
        }
        .chat-item .chat-info { flex: 1; min-width: 0; }
        .chat-item .chat-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: var(--md-ref-typeface-plain);
            transition: color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .chat-item .chat-meta {
            font-size: 0.7rem;
            color: var(--md-sys-color-on-surface-variant);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
            font-family: var(--md-ref-typeface-plain);
            transition: color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .chat-item .chat-meta .pin-icon {
            width: 14px; height: 14px;
            color: var(--md-sys-color-primary);
            stroke-width: 2;
        }
        .chat-item .chat-menu-btn {
            background: transparent;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color var(--motion-duration-medium) var(--motion-easing-emphasized);
            flex-shrink: 0;
        }
        .chat-item .chat-menu-btn:hover { background: var(--md-sys-color-surface-container-highest); }
        .chat-item .chat-menu-btn .lucide { width: 18px; height: 18px; stroke-width: 1.8; }
        /* ===== Dropdown ===== */
        .dropdown-menu {
            position: fixed;
            background: var(--md-sys-color-surface-container);
            border-radius: 12px;
            box-shadow: var(--md-elevation-level3);
            border: 1px solid var(--md-sys-color-outline-variant);
            padding: 4px 0;
            min-width: 160px;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
            transition: opacity 0.15s, transform 0.15s;
        }
        .dropdown-menu.open {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
        .dropdown-menu .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            font-size: 0.85rem;
            color: var(--md-sys-color-on-surface);
            background: transparent;
            border: none;
            width: 100%;
            cursor: pointer;
            font-family: var(--md-ref-typeface-plain);
            transition: background 0.15s, color var(--motion-duration-medium) var(--motion-easing-emphasized);
            border-radius: 0;
        }
        .dropdown-menu .dropdown-item:hover { background: var(--md-sys-color-surface-container-high); }
        .dropdown-menu .dropdown-item.danger { color: var(--md-sys-color-error); }
        .dropdown-menu .dropdown-item .lucide { width: 18px; height: 18px; stroke-width: 1.8; }
        .dropdown-divider {
            height: 1px;
            background: var(--md-sys-color-outline-variant);
            margin: 4px 12px;
        }
        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--motion-duration-medium) var(--motion-easing-emphasized);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: var(--md-sys-color-surface-container);
            border-radius: 20px;

            max-width: 380px;

        .modal-overlay.open .modal-box { transform: scale(1); }
        .modal-box h3 {

        .modal-box .modal-input {

            color: var(--md-sys-color-on-surface);

            font-family: var(--md-ref-typeface-plain);

        .modal-box .modal-input:focus { border-color: var(--md-sys-color-primary); }
        .modal-actions {

        .modal-actions button {

            font-weight: 500;
            font-family: var(--md-ref-typeface-plain);

        }
        .modal-actions .btn-secondary {
            background: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface);
        }
        .modal-actions .btn-secondary:hover { background: var(--md-sys-color-surface-container-highest); }
        .modal-actions .btn-primary {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }
        .modal-actions .btn-primary:hover { background: color-mix(in srgb, var(--md-sys-color-primary) 85%, white); }
        .modal-actions .btn-danger {
            background: var(--md-sys-color-error);
            color: var(--md-sys-color-on-error);
        }
        .modal-actions .btn-danger:hover { background: color-mix(in srgb, var(--md-sys-color-error) 85%, white); }
        /* ===== Chat Container ===== */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 16px calc(80px + var(--safe-area-bottom)) 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            scroll-behavior: smooth;
            background: transparent;
        }
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 55vh;
            text-align: center;
            padding: 30px 20px;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .welcome-logo {
            width: 100px; height: 100px;
            margin-bottom: 16px;
            animation: logoFloat 4s ease-in-out infinite, logoFadeIn 1s ease-out;
            flex-shrink: 0;
        }
        .welcome-logo img {
            width: 100%; height: 100%;
            object-fit: contain;
            border-radius: 16px;
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes logoFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .welcome-title {
            font-family: var(--md-ref-typeface-brand);
            font-style: italic;
            font-weight: 600;
            font-size: 2rem;
            color: var(--md-sys-color-primary);
            margin-bottom: 6px;
            transition: color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .welcome-subtitle {
            font-size: 1rem;
            color: var(--md-sys-color-on-surface-variant);
            max-width: 300px;
            line-height: 1.5;
            font-family: var(--md-ref-typeface-plain);
            transition: color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        /* ===== Messages ===== */
        .message {
            margin: 0;
            padding: 0;
            max-width: 100%;
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-word;
            animation: messageSlideIn 0.3s var(--motion-easing-emphasized);
            font-family: var(--md-ref-typeface-plain);
            position: relative;
            z-index: 2;
        }
        @keyframes messageSlideIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            align-self: flex-end;
            padding: 10px 16px;
            border-radius: 20px 20px 6px 20px;
            max-width: 85%;
            box-shadow: var(--md-elevation-level1);
            border: 1px solid color-mix(in srgb, var(--md-sys-color-primary) 15%, transparent);
            margin-left: auto;
            transition: background var(--motion-duration-medium) var(--motion-easing-emphasized),
                color var(--motion-duration-medium) var(--motion-easing-emphasized),
                border-color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .message.bot {
            background: transparent;
            color: var(--md-sys-color-on-surface);
            align-self: flex-start;
            padding: 2px 0;
            border-radius: 0;
            box-shadow: none;
            border: none;
            max-width: 100%;
            margin-right: 20px;
            transition: color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .message.bot p { margin-bottom: 0.6em; line-height: 1.7; }
        .message.bot p:last-child { margin-bottom: 0; }
        .message.typing {
            align-self: flex-start;
            background: transparent;
            border: none;
            padding: 2px 0;
            box-shadow: none;
        }
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .typing-spinner {
            width: 22px; height: 22px;
            animation: spin 1.2s linear infinite;
            color: var(--md-sys-color-primary);
        }
        .typing-spinner .lucide { width: 100%; height: 100%; stroke-width: 2; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .typing-text {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 0.9rem;
            font-family: var(--md-ref-typeface-plain);
            transition: color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        /* ===== Code Blocks ===== */
        .code-block {
            background: var(--md-sys-color-surface-container-high);
            border-radius: 10px;

            border: 1px solid var(--md-sys-color-outline-variant);

            transition: background var(--motion-duration-medium) var(--motion-easing-emphasized),

        }
        .code-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            height: 32px;
            background: var(--md-sys-color-surface-container);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            font-size: 0.75rem;
            font-family: var(--md-ref-typeface-mono);
            color: var(--md-sys-color-on-surface-variant);

                border-color var(--motion-duration-medium) var(--motion-easing-emphasized),
                color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .code-block-header .lang-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            margin: 0; padding: 0;

        .code-block-header .lang-label .terminal-icon-box {
            display: inline-flex;

            justify-content: center;
            width: 20px; height: 20px;

            color: var(--md-sys-color-on-primary);
            border-radius: 4px;
            padding: 3px;
            flex-shrink: 0;
            transition: background var(--motion-duration-medium) var(--motion-easing-emphasized),
                color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .code-block-header .lang-label .terminal-icon-box .lucide { width: 12px; height: 12px; stroke-width: 2; }
        .code-block-header .action-buttons { display: flex; align-items: center; gap: 2px; margin: 0; padding: 0; }
        .copy-code-btn, .run-js-btn {

            border-radius: 4px;
            background: transparent;
            color: var(--md-sys-color-on-surface-variant);

            justify-content: center;

            box-sizing: border-box;
            flex-shrink: 0;
            line-height: 1;

        .copy-code-btn:hover, .run-js-btn:hover {

            color: var(--md-sys-color-on-primary-container);
        }
        .copy-code-btn:active, .run-js-btn:active { transform: scale(0.9); }
        .copy-code-btn.copied { color: var(--md-sys-color-primary); }
        .copy-code-btn .lucide, .run-js-btn .lucide { width: 14px; height: 14px; stroke-width: 1.8; display: block; }
        .code-block pre {
            margin: 0;
            padding: 10px 12px;
            background: transparent;
            overflow-x: auto;
            font-family: var(--md-ref-typeface-mono);
            font-size: 0.85em;
            line-height: 1.5;
            color: var(--md-sys-color-on-surface);
            transition: color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .code-block code {
            font-family: inherit;
            background: transparent;
            padding: 0;
            border: none;
            color: inherit;
        }
        .js-output {
            margin: 0;
            padding: 8px 12px;
            background: var(--md-sys-color-surface-container);
            border-top: 1px solid var(--md-sys-color-outline-variant);
            font-family: var(--md-ref-typeface-mono);
            font-size: 0.8em;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--md-sys-color-on-surface);
            transition: background var(--motion-duration-medium) var(--motion-easing-emphasized),
                border-color var(--motion-duration-medium) var(--motion-easing-emphasized),
                color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .js-output strong { color: var(--md-sys-color-primary); font-weight: 600; }
        .js-output pre {
            margin: 4px 0 0 0;
            background: transparent;
            padding: 0;
            white-space: pre-wrap;
        }
        .js-output-status {
            color: var(--md-sys-color-on-surface-variant);
            font-style: italic;
            padding: 4px 0;
        }
        /* ===== Markdown ===== */
        .message.bot h1, .message.bot h2, .message.bot h3, .message.bot h4, .message.bot h5, .message.bot h6 {
            margin-top: 1em;
            margin-bottom: 0.4em;
            font-weight: 600;
            line-height: 1.3;
            color: var(--md-sys-color-on-surface);
            font-family: var(--md-ref-typeface-plain);
            transition: color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .message.bot h1 { font-size: 1.4em; border-bottom: 2px solid var(--md-sys-color-primary); padding-bottom: 0.2em; }
        .message.bot h2 { font-size: 1.2em; }
        .message.bot h3 { font-size: 1.1em; }
        .message.bot h4 { font-size: 1em; }
        .message.bot h5 { font-size: 0.95em; }
        .message.bot h6 { font-size: 0.9em; color: var(--md-sys-color-on-surface-variant); }
        .message.bot strong {
            font-weight: 700;
            color: color-mix(in srgb, var(--md-sys-color-on-surface) 90%, var(--md-sys-color-primary));
            transition: color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .message.bot em {
            font-style: italic;
            color: color-mix(in srgb, var(--md-sys-color-on-surface) 80%, var(--md-sys-color-primary));
            transition: color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .message.bot a { color: var(--md-sys-color-primary); text-decoration: underline; text-underline-offset: 2px; transition: color 0.2s; }
        .message.bot a:hover { color: color-mix(in srgb, var(--md-sys-color-primary) 80%, black); }
        .message.bot ul, .message.bot ol { padding-left: 1.6em; margin: 0.6em 0; }
        .message.bot li { margin-bottom: 0.3em; line-height: 1.5; }
        .message.bot blockquote {
            border-left: 3px solid var(--md-sys-color-primary);
            padding-left: 1em;
            margin: 0.8em 0;
            font-style: italic;
            color: var(--md-sys-color-on-surface-variant);
            padding: 0.4em 0.8em;
            border-radius: 0 6px 6px 0;
            background: color-mix(in srgb, var(--md-sys-color-surface-container) 50%, transparent);
            transition: border-color var(--motion-duration-medium) var(--motion-easing-emphasized),
                color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .message.bot table {
            border-collapse: collapse;
            margin: 0.8em 0;

            overflow-x: auto;
            display: block;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 10px;
            box-shadow: var(--md-elevation-level1);
        }
        .message.bot table thead {
            background: color-mix(in srgb, var(--md-sys-color-surface-container) 70%, transparent);
            border-bottom: 2px solid var(--md-sys-color-outline);
        }
        .message.bot table th { padding: 8px 12px; text-align: left; font-weight: 600; color: var(--md-sys-color-on-surface); border-right: 1px solid var(--md-sys-color-outline-variant); }
        .message.bot table td { padding: 8px 12px; border-right: 1px solid var(--md-sys-color-outline-variant); border-bottom: 1px solid var(--md-sys-color-outline-variant); color: var(--md-sys-color-on-surface); }
        .message.bot table tr:last-child td { border-bottom: none; }

        .message.bot table tr:nth-child(even) { background: color-mix(in srgb, var(--md-sys-color-surface-container) 30%, transparent); }
        .message.bot table tr:hover { background: color-mix(in srgb, var(--md-sys-color-primary-container) 10%, transparent); }

            font-size: 0.8em;
            font-family: var(--md-ref-typeface-mono);

        .message.bot :not(pre)>code {
            background: color-mix(in srgb, var(--md-sys-color-primary-container) 30%, transparent);
            color: var(--md-sys-color-on-primary-container);
            padding: 0.1em 0.4em;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 500;
            border: 1px solid color-mix(in srgb, var(--md-sys-color-primary) 15%, transparent);

        .message.bot img {

        /* ===== Input Area ===== */
        .input-area {
            margin: 0 14px var(--input-area-bottom) 14px;

            flex-direction: column;

            padding-bottom: var(--safe-area-bottom);

            gap: 4px;

        .text-row {
            display: flex;
            align-items: flex-start;
            width: 100%;

            background: var(--md-sys-color-primary-container);

            background: color-mix(in srgb, var(--md-sys-color-primary) 90%, white);
        }
        .send-btn:active:not(:disabled) { transform: scale(0.94); }
        .send-btn:disabled {
            background: var(--md-sys-color-surface-container-highest);
            color: var(--md-sys-color-on-surface-variant);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            opacity: 0.5;
        }
        .send-btn .lucide { width: 20px; height: 20px; stroke-width: 2; }
        /* ===== Active Chips ===== */
        .active-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 4px;
            padding: 0 2px;
        }
        .active-chip {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px 3px 6px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
            font-family: var(--md-ref-typeface-plain);
            background: var(--md-sys-color-surface-container);
            border: 1px solid var(--md-sys-color-outline-variant);
            color: var(--md-sys-color-on-surface);
            cursor: default;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .active-chip .chip-icon { width: 12px; height: 12px; stroke-width: 2; }
        .active-chip .chip-close {
            background: transparent;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            cursor: pointer;
            padding: 0 2px;
            font-size: 0.9rem;
            line-height: 1;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .active-chip .chip-close:hover { color: var(--md-sys-color-error); }
        .active-chip.image-chip {
            border-color: var(--md-sys-color-primary);
            background: color-mix(in srgb, var(--md-sys-color-primary) 15%, var(--md-sys-color-surface));
        }
        .active-chip.web-chip {
            border-color: var(--md-sys-color-secondary);
            background: color-mix(in srgb, var(--md-sys-color-secondary) 15%, var(--md-sys-color-surface));
        }
        .active-chip.theme-chip {
            border-color: var(--md-sys-color-tertiary);
            background: color-mix(in srgb, var(--md-sys-color-tertiary) 15%, var(--md-sys-color-surface));
        }
        /* ===== Popover ===== */
        .popover-panel {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            background: var(--md-sys-color-surface-container);
            border-radius: 14px;
            box-shadow: var(--md-elevation-level3);
            border: 1px solid var(--md-sys-color-outline-variant);
            padding: 4px 0;
            min-width: 170px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(6px) scale(0.96);
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
            visibility: hidden;
            z-index: 20;
            backdrop-filter: var(--glass-backdrop-blur);
            -webkit-backdrop-filter: var(--glass-backdrop-blur);
        }
        .popover-panel.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
            visibility: visible;
        }
        .popover-panel .popover-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            font-size: 0.85rem;
            color: var(--md-sys-color-on-surface);
            background: transparent;
            border: none;
            width: 100%;
            cursor: pointer;
            font-family: var(--md-ref-typeface-plain);
            transition: background 0.15s, color var(--motion-duration-medium) var(--motion-easing-emphasized);
            border-radius: 0;
            text-align: left;
        }
        .popover-panel .popover-item:hover { background: var(--md-sys-color-surface-container-high); }
        .popover-panel .popover-item .lucide { width: 18px; height: 18px; stroke-width: 1.8; flex-shrink: 0; }
        .popover-panel .popover-item .toggle-indicator {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--md-sys-color-on-surface-variant);
        }
        .popover-panel .popover-item.active .toggle-indicator { color: var(--md-sys-color-primary); }
        .popover-panel .popover-divider {
            height: 1px;
            background: var(--md-sys-color-outline-variant);
            margin: 4px 12px;
        }
        /* ===== Error ===== */
        .error {
            background: color-mix(in srgb, var(--md-sys-color-error) 10%, var(--md-sys-color-surface));
            color: var(--md-sys-color-error);
            padding: 12px 16px;
            border-radius: 12px;
            margin: 12px 16px;
            font-size: 0.9rem;
            text-align: center;
            border-left: 3px solid var(--md-sys-color-error);
            animation: fadeIn 0.5s;
            box-shadow: var(--md-elevation-level1);
            font-family: var(--md-ref-typeface-plain);
            position: relative;
            z-index: 2;
        }
        .hidden { display: none !important; }
        /* ===== Install Banner ===== */
        .install-banner {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            padding: 10px 14px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            z-index: 101;
            box-shadow: var(--md-elevation-level2);
            animation: fadeInUp 0.4s ease;
            font-family: var(--md-ref-typeface-plain);
        }
        .install-banner span { font-size: 0.85rem; font-weight: 500; }
        .install-banner button {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border-radius: 16px;
            padding: 4px 14px;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            font-family: var(--md-ref-typeface-plain);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* ===== Theme Notification ===== */
        .theme-notification {
            background: color-mix(in srgb, var(--md-sys-color-surface-container) 90%, var(--md-sys-color-on-surface));
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 12px;
            padding: 8px 14px;
            margin: 0 4px 10px 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--md-sys-color-on-surface);
            animation: fadeIn 0.4s ease;
            box-shadow: var(--md-elevation-level1);
            position: relative;
            z-index: 2;
        }
        .theme-notification .notif-dismiss {
            background: transparent;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            cursor: pointer;
            padding: 0 4px;
            font-size: 1.1rem;
            line-height: 1;
            transition: color 0.2s;
        }
        .theme-notification .notif-dismiss:hover { color: var(--md-sys-color-error); }
        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            :root { --header-height: 48px; --input-area-bottom: 12px; }
            .header { padding: 6px 12px; }
            .header-title { font-size: 1rem; }
            .header .logo-icon { width: 28px; height: 28px; }
            .sidebar-toggle { width: 32px; height: 32px; }
            .sidebar-toggle .lucide { width: 20px; height: 20px; }
            .theme-toggle { width: 32px; height: 32px; }
            .theme-toggle .lucide { width: 18px; height: 18px; }
            .chat-container { padding: 12px 12px calc(80px + var(--safe-area-bottom)) 12px; }
            .welcome-logo { width: 80px; height: 80px; }
            .welcome-title { font-size: 1.6rem; }
            .welcome-subtitle { font-size: 0.9rem; max-width: 240px; }
            .message { font-size: 0.9rem; }
            .message.user { padding: 8px 14px; max-width: 90%; }
            .message.bot { padding: 2px 0; }
            .input-area { margin: 0 10px var(--input-area-bottom) 10px; }
            .composer-pill { padding: 4px 8px 4px 12px; border-radius: 20px; }
            #messageInput { font-size: 0.9rem; min-height: 22px; }
            .plus-btn { width: 28px; height: 28px; }
            .plus-btn .lucide { width: 16px; height: 16px; }
            .mode-chip { font-size: 0.7rem; padding: 3px 6px; }
            .mode-chip .lucide { width: 12px; height: 12px; }
            .send-btn { width: 32px; height: 32px; }
            .send-btn .lucide { width: 18px; height: 18px; }
            .sidebar { width: 85vw; max-width: 300px; }
            .modal-box { padding: 20px 20px 16px; max-width: 320px; }
            .code-block-header { height: 28px; font-size: 0.65rem; }
            .copy-code-btn, .run-js-btn { width: 22px; height: 22px; }
            .copy-code-btn .lucide, .run-js-btn .lucide { width: 12px; height: 12px; }
            .code-block-header .lang-label .terminal-icon-box { width: 18px; height: 18px; }
            .code-block-header .lang-label .terminal-icon-box .lucide { width: 10px; height: 10px; }
            .popover-panel { min-width: 140px; }
            .active-chip { font-size: 0.65rem; padding: 2px 6px 2px 4px; }
            .active-chip .chip-icon { width: 10px; height: 10px; }
            .install-banner { bottom: 70px; left: 12px; right: 12px; }
        }
        @media (max-width: 400px) {
            .header-title { font-size: 0.85rem; }
            .chat-item { padding: 6px 10px; }
            .chat-item .chat-title { font-size: 0.8rem; }
            .dropdown-menu { min-width: 130px; }
            .mode-chip span.mode-label { display: none; }
            .mode-chip { padding: 4px 6px; }
        }
        /* ===== Background Support ===== */
        .bg-animated { transition: background 0.8s ease; }
        .bg-animated-gradient {
            background-size: 400% 400% !important;
            animation: gradientShift 12s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #dynamicThemeStyle { display: none; }
    </style>
</head>
<body>
    <!-- ===== BACKGROUND LAYERS ===== -->
    <div id="bgAnimationContainer"></div>
    <div id="svgBackground"></div>
    <canvas id="particleCanvas"></canvas>

    <!-- ===== APP WRAPPER ===== -->
    <div class="app-wrapper">
        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                    <i data-lucide="panel-left" class="lucide"></i>
                </button>
                <span class="logo-icon">
                    <img src="logo.svg" alt="Aariz Logo" />
                </span>
                <span class="header-title">Aariz</span>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <i data-lucide="moon" class="lucide" id="themeIcon"></i>
                </button>
            </div>
        </div>

        <!-- ===== CHAT CONTAINER ===== -->
        <div class="chat-container" id="chatContainer">
            <div class="welcome-container" id="welcomeMessage">
                <div class="welcome-logo">
                    <img src="logo.svg" alt="Aariz Logo" />
                </div>
                <h1 class="welcome-title">Hello, I'm Aariz</h1>
                <p class="welcome-subtitle">Your AI assistant powered by Gemini. Ask me anything, and let's have a great conversation!</p>
            </div>
        </div>

        <!-- ===== INPUT AREA ===== -->
        <div class="input-area" id="inputArea">
            <div class="active-chips" id="activeChips"></div>
            <div class="composer-pill">
                <div class="text-row">
                    <textarea id="messageInput" placeholder="Message Aariz..." rows="1"></textarea>
                </div>
                <div class="toolbar-row">
                    <button class="plus-btn" id="plusBtn" aria-label="More options">
                        <i data-lucide="plus" class="lucide"></i>
                    </button>
                    <button class="mode-chip" id="modeChip" aria-label="Switch mode">
                        <i data-lucide="zap" class="lucide"></i>
                        <span class="mode-label" id="modeLabel">Chat</span>
                    </button>
                    <div class="mode-select-panel" id="modeSelectPanel">
                        <button class="mode-option active-opt" data-mode="chat">
                            <i data-lucide="zap" class="lucide"></i> Chat
                            <span class="check-mark">✓</span>
                        </button>
                        <button class="mode-option" data-mode="image">
                            <i data-lucide="image" class="lucide"></i> Image
                            <span class="check-mark">✓</span>
                        </button>
                    </div>
                    <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
                        <i data-lucide="arrow-up" class="lucide"></i>
                    </button>
                </div>
            </div>
            <!-- Popover -->
            <div class="popover-panel" id="popoverPanel">
                <button class="popover-item" id="webSearchToggle">
                    <i data-lucide="globe" class="lucide"></i> Web search
                    <span class="toggle-indicator" id="webSearchIndicator">Off</span>
                </button>
                <button class="popover-item" id="themeModeToggle">
                    <i data-lucide="palette" class="lucide"></i> Theme mode
                    <span class="toggle-indicator" id="themeModeIndicator">Off</span>
                </button>
                <div class="popover-divider"></div>
                <button class="popover-item" id="resetThemePopover">
                    <i data-lucide="rotate-ccw" class="lucide"></i> Reset Theme
                </button>
            </div>
        </div>

        <!-- ===== ERROR ===== -->
        <div id="error" class="error hidden"></div>

        <!-- ===== INSTALL BANNER ===== -->
        <div id="installBanner" class="install-banner hidden">
            <span>Install Aariz for quick access</span>
            <div style="display:flex; gap:6px;">
                <button id="installBtn">Install</button>
                <button id="dismissInstall" style="background:transparent; color:inherit; padding:4px 8px;">✕</button>
            </div>
        </div>

        <!-- ===== SIDEBAR ===== -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Chats</h2>
                <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">
                    <i data-lucide="x" class="lucide"></i>
                </button>
            </div>
            <div class="sidebar-body" id="sidebarBody">
                <button class="new-chat-btn" id="newChatBtn">
                    <i data-lucide="plus" class="lucide"></i> New Chat
                </button>
                <div class="chat-list" id="chatList"></div>
            </div>
        </div>

        <!-- ===== DROPDOWN ===== -->
        <div class="dropdown-menu" id="dropdownMenu">
            <button class="dropdown-item" id="dropdownPin"><i data-lucide="pin" class="lucide"></i> Pin</button>
            <button class="dropdown-item" id="dropdownRename"><i data-lucide="pencil" class="lucide"></i> Rename</button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item danger" id="dropdownDelete"><i data-lucide="trash-2" class="lucide"></i> Delete</button>
        </div>

        <!-- ===== MODAL ===== -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-box">
                <h3 id="modalTitle">Confirm</h3>
                <p id="modalMessage">Are you sure?</p>
                <input class="modal-input hidden" id="modalInput" type="text" placeholder="New name..." />
                <div class="modal-actions">
                    <button class="btn-secondary" id="modalCancel">Cancel</button>
                    <button class="btn-primary" id="modalConfirm">Confirm</button>
                </div>
            </div>
        </div>

        <!-- ===== DYNAMIC THEME STYLE ===== -->
        <style id="dynamicThemeStyle"></style>
    </div>
    
    <script src="app.js"></script>
    
</body>
</html>
