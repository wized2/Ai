    <style>
        /* ===== CSS Variables (unchanged) ===== */
        :root {
            --md-sys-color-primary: #DB6B46;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #FFFFFF;
            --md-sys-color-on-primary-container: #DB6B46;
            --md-sys-color-secondary: #5C4B3E;
            --md-sys-color-on-secondary: #FFFFFF;
            --md-sys-color-secondary-container: #E6DCD6;
            --md-sys-color-on-secondary-container: #3D2F26;
            --md-sys-color-tertiary: #5A6B5A;
            --md-sys-color-on-tertiary: #FFFFFF;
            --md-sys-color-tertiary-container: #DDF2DD;
            --md-sys-color-on-tertiary-container: #3D4F3D;
            --md-sys-color-surface: #FEFAE0;
            --md-sys-color-surface-dim: #E5E1C9;
            --md-sys-color-surface-bright: #FEFAE0;
            --md-sys-color-surface-container: #F5F1D7;
            --md-sys-color-surface-container-high: #EFEBD1;
            --md-sys-color-surface-container-highest: #E9E5CB;
            --md-sys-color-surface-container-low: #FBF7DD;
            --md-sys-color-surface-container-lowest: #FFFFFF;
            --md-sys-color-on-surface: #1C1A12;
            --md-sys-color-on-surface-variant: #4D473D;
            --md-sys-color-outline: #7D776C;
            --md-sys-color-outline-variant: #CBC5B8;
            --md-sys-color-inverse-surface: #2F2D25;
            --md-sys-color-inverse-on-surface: #F5F1E7;
            --md-sys-color-error: #BA1A1A;
            --md-sys-color-on-error: #FFFFFF;
            --md-sys-color-error-container: #FFDAD6;
            --md-sys-color-on-error-container: #93000A;
            --md-sys-color-scrim: #000000;
            --md-elevation-level1: 0 1px 3px 0 rgba(0, 0, 0, 0.10);
            --md-elevation-level2: 0 3px 6px rgba(0, 0, 0, 0.14);
            --md-elevation-level3: 0 10px 20px rgba(0, 0, 0, 0.17);
            --md-ref-typeface-brand: 'Prompt', sans-serif;
            --md-ref-typeface-plain: 'Nunito Sans', system-ui, sans-serif;
            --md-ref-typeface-mono: 'Roboto Mono', monospace;
            --glass-background-light: rgba(255, 255, 255, 0.7);
            --glass-background-dark: rgba(30, 30, 35, 0.7);
            --glass-backdrop-blur: blur(20px);
            --motion-easing-emphasized: cubic-bezier(0.2, 0.0, 0.0, 1.0);
            --motion-duration-medium: 300ms;
            color-scheme: light;
            --sidebar-width: 300px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --md-sys-color-surface: #000000;
                --md-sys-color-surface-dim: #000000;
                --md-sys-color-surface-bright: #2A2A2A;
                --md-sys-color-surface-container: #141414;
                --md-sys-color-surface-container-high: #1E1E1E;
                --md-sys-color-surface-container-highest: #292929;
                --md-sys-color-surface-container-low: #0A0A0A;
                --md-sys-color-surface-container-lowest: #000000;
                --md-sys-color-on-surface: #E8E4DA;
                --md-sys-color-on-surface-variant: #CBC5B8;
                --md-sys-color-outline: #948E82;
                --md-sys-color-outline-variant: #4D473D;
                --md-sys-color-inverse-surface: #E8E4DA;
                --md-sys-color-inverse-on-surface: #2F2D25;
                --md-sys-color-primary-container: #FFFFFF;
                --md-sys-color-on-primary-container: #DB6B46;
                --md-sys-color-secondary-container: #3D2F26;
                --md-sys-color-on-secondary-container: #E6DCD6;
                --md-sys-color-tertiary-container: #3D4F3D;
                --md-sys-color-on-tertiary-container: #DDF2DD;
                --md-sys-color-error: #FFB4AB;
                --md-sys-color-on-error: #690005;
                --md-sys-color-error-container: #93000A;
                --md-sys-color-on-error-container: #FFDAD6;
                --md-sys-color-scrim: #000000;
                --md-elevation-level1: 0 1px 3px 0 rgba(0, 0, 0, 0.5);
                --md-elevation-level2: 0 3px 6px rgba(0, 0, 0, 0.6);
                --md-elevation-level3: 0 10px 20px rgba(0, 0, 0, 0.7);
                color-scheme: dark;
            }
        }
        .theme-dark {
            --md-sys-color-surface: #000000;
            --md-sys-color-surface-dim: #000000;
            --md-sys-color-surface-bright: #2A2A2A;
            --md-sys-color-surface-container: #141414;
            --md-sys-color-surface-container-high: #1E1E1E;
            --md-sys-color-surface-container-highest: #292929;
            --md-sys-color-surface-container-low: #0A0A0A;
            --md-sys-color-surface-container-lowest: #000000;
            --md-sys-color-on-surface: #E8E4DA;
            --md-sys-color-on-surface-variant: #CBC5B8;
            --md-sys-color-outline: #948E82;
            --md-sys-color-outline-variant: #4D473D;
            --md-sys-color-inverse-surface: #E8E4DA;
            --md-sys-color-inverse-on-surface: #2F2D25;
            --md-sys-color-primary-container: #FFFFFF;
            --md-sys-color-on-primary-container: #DB6B46;
            --md-sys-color-secondary-container: #3D2F26;
            --md-sys-color-on-secondary-container: #E6DCD6;
            --md-sys-color-tertiary-container: #3D4F3D;
            --md-sys-color-on-tertiary-container: #DDF2DD;
            --md-sys-color-error: #FFB4AB;
            --md-sys-color-on-error: #690005;
            --md-sys-color-error-container: #93000A;
            --md-sys-color-on-error-container: #FFDAD6;
            --md-sys-color-scrim: #000000;
            --md-elevation-level1: 0 1px 3px 0 rgba(0, 0, 0, 0.5);
            --md-elevation-level2: 0 3px 6px rgba(0, 0, 0, 0.6);
            --md-elevation-level3: 0 10px 20px rgba(0, 0, 0, 0.7);
            color-scheme: dark;
        }
        .theme-light {
            --md-sys-color-surface: #FEFAE0;
            --md-sys-color-surface-dim: #E5E1C9;
            --md-sys-color-surface-bright: #FEFAE0;
            --md-sys-color-surface-container: #F5F1D7;
            --md-sys-color-surface-container-high: #EFEBD1;
            --md-sys-color-surface-container-highest: #E9E5CB;
            --md-sys-color-surface-container-low: #FBF7DD;
            --md-sys-color-surface-container-lowest: #FFFFFF;
            --md-sys-color-on-surface: #1C1A12;
            --md-sys-color-on-surface-variant: #4D473D;
            --md-sys-color-outline: #7D776C;
            --md-sys-color-outline-variant: #CBC5B8;
            --md-sys-color-inverse-surface: #2F2D25;
            --md-sys-color-inverse-on-surface: #F5F1E7;
            --md-sys-color-primary-container: #FFFFFF;
            --md-sys-color-on-primary-container: #DB6B46;
            --md-sys-color-secondary-container: #E6DCD6;
            --md-sys-color-on-secondary-container: #3D2F26;
            --md-sys-color-tertiary-container: #DDF2DD;
            --md-sys-color-on-tertiary-container: #3D4F3D;
            --md-sys-color-error: #BA1A1A;
            --md-sys-color-on-error: #FFFFFF;
            --md-sys-color-error-container: #FFDAD6;
            --md-sys-color-on-error-container: #93000A;
            --md-sys-color-scrim: #000000;
            --md-elevation-level1: 0 1px 3px 0 rgba(0, 0, 0, 0.10);
            --md-elevation-level2: 0 3px 6px rgba(0, 0, 0, 0.14);
            --md-elevation-level3: 0 10px 20px rgba(0, 0, 0, 0.17);
            color-scheme: light;
        }
        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--md-ref-typeface-plain);
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            height: 100vh;
            max-width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .smooth-transition * {
            transition: background-color var(--motion-duration-medium) var(--motion-easing-emphasized),
                color var(--motion-duration-medium) var(--motion-easing-emphasized),
                border-color var(--motion-duration-medium) var(--motion-easing-emphasized),
                box-shadow var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        /* ===== Header ===== */
        .header {
            padding: 12px 16px;
            font-family: var(--md-ref-typeface-brand);
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--md-sys-color-primary);
            background: var(--md-sys-color-surface-container);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: var(--glass-backdrop-blur);
            -webkit-backdrop-filter: var(--glass-backdrop-blur);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            transition: all var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .logo-icon {
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .header .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 8px;
        }
        .header-title {
            font-family: var(--md-ref-typeface-brand);
            font-style: italic;
            font-weight: 600;
            color: var(--md-sys-color-primary);
            font-size: 1.3rem;
            letter-spacing: -0.02em;
        }
        .hamburger-btn {
            background: transparent;
            color: var(--md-sys-color-on-surface-variant);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .hamburger-btn:hover {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            transform: scale(1.05);
        }
        .hamburger-btn:active {
            transform: scale(0.95);
        }
        .hamburger-btn .lucide {
            width: 28px;
            height: 28px;
            stroke-width: 1.8;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .theme-toggle {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--motion-duration-medium) var(--motion-easing-emphasized);
            box-shadow: var(--md-elevation-level1);
        }
        .theme-toggle:hover {
            transform: scale(1.08) rotate(8deg);
            box-shadow: var(--md-elevation-level2);
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }
        .theme-toggle:active {
            transform: scale(0.95);
        }
        .theme-toggle .lucide {
            width: 24px;
            height: 24px;
            stroke-width: 1.8;
            transition: transform var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        /* ===== Sidebar (unchanged) ===== */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .sidebar-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            max-width: 85vw;
            height: 100%;
            background: var(--md-sys-color-surface-container);
            z-index: 201;
            transform: translateX(-100%);
            transition: transform var(--motion-duration-medium) var(--motion-easing-emphasized);
            box-shadow: var(--md-elevation-level3);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--md-sys-color-outline-variant);
        }
        .sidebar.open {
            transform: translateX(0);
        }
        .sidebar-header {
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            flex-shrink: 0;
            min-height: 68px;
        }
        .sidebar-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--md-sys-color-on-surface);
            font-family: var(--md-ref-typeface-plain);
        }
        .sidebar-close {
            background: transparent;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            width: 40px;
            height: 40px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.4rem;
            transition: background 0.2s;
        }
        .sidebar-close:hover {
            background: var(--md-sys-color-surface-container-high);
        }
        .sidebar-close .lucide {
            width: 24px;
            height: 24px;
            stroke-width: 1.8;
        }
        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px 20px;
        }
        .sidebar-body::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar-body::-webkit-scrollbar-thumb {
            background: var(--md-sys-color-outline-variant);
            border-radius: 4px;
        }
        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px dashed var(--md-sys-color-outline);
            background: transparent;
            color: var(--md-sys-color-on-surface);
            font-size: 0.95rem;
            font-weight: 500;
            font-family: var(--md-ref-typeface-plain);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
        }
        .new-chat-btn:hover {
            background: var(--md-sys-color-primary-container);
            border-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary-container);
        }
        .new-chat-btn .lucide {
            width: 22px;
            height: 22px;
            stroke-width: 1.8;
        }
        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-list-empty {
            text-align: center;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 0.9rem;
            padding: 40px 10px;
            line-height: 1.6;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            border: 1px solid transparent;
        }
        .chat-item:hover {
            background: var(--md-sys-color-surface-container-high);
        }
        .chat-item.active {
            background: var(--md-sys-color-primary-container);
            border-color: var(--md-sys-color-primary);
        }
        .chat-item .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-item .chat-title {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: var(--md-ref-typeface-plain);
        }
        .chat-item .chat-meta {
            font-size: 0.7rem;
            color: var(--md-sys-color-on-surface-variant);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
            font-family: var(--md-ref-typeface-plain);
        }
        .chat-item .chat-meta .pin-icon {
            width: 14px;
            height: 14px;
            color: var(--md-sys-color-primary);
            stroke-width: 2;
        }
        .chat-item .chat-menu-btn {
            background: transparent;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            width: 34px;
            height: 34px;
            border-radius: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .chat-item .chat-menu-btn:hover {
            background: var(--md-sys-color-surface-container-highest);
        }
        .chat-item .chat-menu-btn .lucide {
            width: 20px;
            height: 20px;
            stroke-width: 1.8;
        }
        .dropdown-menu {
            position: fixed;
            background: var(--md-sys-color-surface-container);
            border-radius: 16px;
            box-shadow: var(--md-elevation-level3);
            border: 1px solid var(--md-sys-color-outline-variant);
            padding: 6px 0;
            min-width: 160px;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
            transition: opacity 0.15s, transform 0.15s;
        }
        .dropdown-menu.open {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
        .dropdown-menu .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            font-size: 0.9rem;
            color: var(--md-sys-color-on-surface);
            background: transparent;
            border: none;
            width: 100%;
            cursor: pointer;
            font-family: var(--md-ref-typeface-plain);
            transition: background 0.15s;
            border-radius: 0;
        }
        .dropdown-menu .dropdown-item:hover {
            background: var(--md-sys-color-surface-container-high);
        }
        .dropdown-menu .dropdown-item.danger {
            color: var(--md-sys-color-error);
        }
        .dropdown-menu .dropdown-item .lucide {
            width: 20px;
            height: 20px;
            stroke-width: 1.8;
        }
        .dropdown-divider {
            height: 1px;
            background: var(--md-sys-color-outline-variant);
            margin: 4px 12px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--motion-duration-medium) var(--motion-easing-emphasized);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: var(--md-sys-color-surface-container);
            border-radius: 28px;
            padding: 28px 32px 24px;
            max-width: 380px;
            width: 90%;
            box-shadow: var(--md-elevation-level3);
            transform: scale(0.92);
            transition: transform var(--motion-duration-medium) var(--motion-easing-emphasized);
        }
        .modal-overlay.open .modal-box {
            transform: scale(1);
        }
        .modal-box h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--md-sys-color-on-surface);
            font-family: var(--md-ref-typeface-plain);
        }
        .modal-box p {

                <i data-lucide="x" class="lucide"></i>
            </button>
        </div>
        <div class="sidebar-body" id="sidebarBody">
            <button class="new-chat-btn" id="newChatBtn">
                <i data-lucide="plus" class="lucide"></i> New Chat
            </button>
            <div class="chat-list" id="chatList">
                <!-- Rendered by JS -->
            </div>
        </div>
    </div>

    <!-- ===== DROPDOWN MENU ===== -->
    <div class="dropdown-menu" id="dropdownMenu">
        <button class="dropdown-item" id="dropdownPin" data-action="pin">
            <i data-lucide="pin" class="lucide"></i> Pin
        </button>
        <button class="dropdown-item" id="dropdownRename" data-action="rename">
            <i data-lucide="pencil" class="lucide"></i> Rename
        </button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item danger" id="dropdownDelete" data-action="delete">
            <i data-lucide="trash-2" class="lucide"></i> Delete
        </button>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h3 id="modalTitle">Confirm</h3>
            <p id="modalMessage">Are you sure?</p>
            <input class="modal-input hidden" id="modalInput" type="text" placeholder="New name..." />
            <div class="modal-actions">
                <button class="btn-secondary" id="modalCancel">Cancel</button>
                <button class="btn-primary" id="modalConfirm">Confirm</button>
            </div>
        </div>
    </div>


    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT ===== -->
    <!-- ============================================================ -->
    <script>
        // ================================================================
        //  CHAT MANAGER (unchanged)
        // ================================================================
        const STORAGE_KEY = 'endroid_chats_v2';
        const MAX_CHATS = 8;

        let chatManager = {
            chats: [],
            activeId: null,
            _nextId: 1,

            init() {
                this.load();
                if (this.chats.length === 0) {
                    this.createChat('New Chat');
                }
                if (!this.activeId && this.chats.length > 0) {
                    this.activeId = this.chats[0].id;
                }
                this.save();
                return this;
            },

            createChat(title) {
                if (this.chats.length >= MAX_CHATS) return null;
                const chat = {
                    id: 'chat_' + (this._nextId++),
                    title: title || 'New Chat',
                    messages: [],
                    pinned: false,
                    createdAt: Date.now(),
                    updatedAt: Date.now(),
                };
                this.chats.push(chat);
                this.activeId = chat.id;
                this.save();
                return chat;
            },

            deleteChat(id) {
                const idx = this.chats.findIndex(c => c.id === id);
                if (idx === -1) return false;
                this.chats.splice(idx, 1);
                if (this.activeId === id) {
                    this.activeId = this.chats.length > 0 ? this.chats[0].id : null;
                }
                if (this.chats.length === 0) {
                    this.createChat('New Chat');
                }
                this.save();
                return true;
            },

            renameChat(id, newTitle) {
                const chat = this.getChat(id);
                if (!chat || !newTitle.trim()) return false;
                chat.title = newTitle.trim();
                chat.updatedAt = Date.now();
                this.save();
                return true;
            },

            togglePin(id) {
                const chat = this.getChat(id);
                if (!chat) return false;
                chat.pinned = !chat.pinned;
                chat.updatedAt = Date.now();
                this.save();
                return true;
            },

            setPinned(id, pinned) {
                const chat = this.getChat(id);
                if (!chat) return false;
                chat.pinned = !!pinned;
                chat.updatedAt = Date.now();
                this.save();
                return true;
            },

            getChat(id) {
                return this.chats.find(c => c.id === id) || null;
            },

            getActive() {
                return this.getChat(this.activeId);
            },

            switchTo(id) {
                if (this.getChat(id)) {
                    this.activeId = id;
                    this.save();
                    return true;
                }
                return false;
            },

            addMessage(chatId, role, text) {
                const chat = this.getChat(chatId);
                if (!chat) return false;
                chat.messages.push({ role, text });
                chat.updatedAt = Date.now();
                this.save();
                return true;
            },

            clearMessages(chatId) {
                const chat = this.getChat(chatId);
                if (!chat) return false;
                chat.messages = [];
                chat.updatedAt = Date.now();
                this.save();
                return true;
            },

            save() {
                try {
                    const data = {
                        chats: this.chats,
                        activeId: this.activeId,
                        nextId: this._nextId,
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) { console.warn('Save failed:', e); }
            },

            load() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) {
                        this._migrateOld();
                        return;
                    }
                    const data = JSON.parse(raw);
                    this.chats = data.chats || [];
                    this.activeId = data.activeId || null;
                    this._nextId = data.nextId || 1;
                    this.chats.forEach(c => {
                        if (!c.messages) c.messages = [];
                        if (typeof c.pinned !== 'boolean') c.pinned = false;
                        if (!c.createdAt) c.createdAt = Date.now();
                        if (!c.updatedAt) c.updatedAt = Date.now();
                    });
                    if (this.chats.length === 0) {
                        this.createChat('New Chat');
                    }
                    if (!this.getChat(this.activeId) && this.chats.length > 0) {
                        this.activeId = this.chats[0].id;
                    }
                } catch (e) {
                    console.warn('Load failed:', e);
                    this.chats = [];
                    this.activeId = null;
                    this._nextId = 1;
                    this.createChat('New Chat');
                }
            },

            _migrateOld() {
                try {
                    const oldRaw = localStorage.getItem('endroid_conversation');
                    if (!oldRaw) return;
                    const oldHistory = JSON.parse(oldRaw);
                    if (!Array.isArray(oldHistory) || oldHistory.length === 0) return;
                    const chat = {
                        id: 'chat_' + (this._nextId++),
                        title: 'Chat',
                        messages: oldHistory,
                        pinned: false,
                        createdAt: Date.now(),
                        updatedAt: Date.now(),
                    };
                    this.chats = [chat];
                    this.activeId = chat.id;
                    this.save();
                    localStorage.removeItem('endroid_conversation');
                } catch (e) { console.warn('Migration failed:', e); }
            },

            getSortedChats() {
                const pinned = this.chats.filter(c => c.pinned);
                const unpinned = this.chats.filter(c => !c.pinned);
                pinned.sort((a, b) => a.title.localeCompare(b.title));
                unpinned.sort((a, b) => b.updatedAt - a.updatedAt);
                return [...pinned, ...unpinned];
            },

            getTitle(chat) {
                if (!chat) return 'Chat';
                if (chat.title && chat.title.trim()) return chat.title.trim();
                const firstUser = chat.messages.find(m => m.role === 'user');
                if (firstUser) {
                    const snippet = firstUser.text.slice(0, 30);
                    return snippet + (firstUser.text.length > 30 ? '…' : '');
                }
                return 'New Chat';
            },

            getPreview(chat) {
                if (!chat || chat.messages.length === 0) return 'Empty chat';
                const last = chat.messages[chat.messages.length - 1];
                if (!last) return 'Empty chat';
                const snippet = last.text.slice(0, 40);
                return snippet + (last.text.length > 40 ? '…' : '');
            },
        };

        // ================================================================
        //  UI RENDERER
        // ================================================================
        const UI = {
            chatContainer: document.getElementById('chatContainer'),
            welcomeEl: document.getElementById('welcomeMessage'),
            chatList: document.getElementById('chatList'),
            sidebar: document.getElementById('sidebar'),
            overlay: document.getElementById('sidebarOverlay'),
            dropdown: document.getElementById('dropdownMenu'),
            modalOverlay: document.getElementById('modalOverlay'),
            modalTitle: document.getElementById('modalTitle'),
            modalMessage: document.getElementById('modalMessage'),
            modalInput: document.getElementById('modalInput'),
            modalConfirm: document.getElementById('modalConfirm'),
            modalCancel: document.getElementById('modalCancel'),
            input: document.getElementById('messageInput'),
            sendBtn: document.getElementById('sendBtn'),
            error: document.getElementById('error'),
            webSearchBtn: document.getElementById('webSearchToggle'),
            imageToggleBtn: document.getElementById('imageToggle'),

            _typingId: null,
            _dropdownTargetId: null,
            _errorTimer: null,

            init() {
                this._bindEvents();
                this.render();
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            },

            _bindEvents() {
                document.getElementById('hamburgerBtn').addEventListener('click', () => this.openSidebar());
                document.getElementById('sidebarClose').addEventListener('click', () => this.closeSidebar());
                this.overlay.addEventListener('click', () => this.closeSidebar());

                document.getElementById('newChatBtn').addEventListener('click', () => {
                    this.closeSidebar();
                    this.newChat();
                });

                this.modalCancel.addEventListener('click', () => this.closeModal());
                this.modalOverlay.addEventListener('click', (e) => {
                    if (e.target === this.modalOverlay) this.closeModal();
                });
                this.modalConfirm.addEventListener('click', () => this._handleModalConfirm());

                document.addEventListener('click', (e) => {
                    const target = e.target.closest('.dropdown-menu') || e.target.closest('.chat-menu-btn');
                    if (!target) this.closeDropdown();
                });
                document.getElementById('dropdownPin').addEventListener('click', () => {
                    const id = this._dropdownTargetId;
                    if (!id) return;
                    chatManager.togglePin(id);
                    this.closeDropdown();
                    this.render();
                    this.renderChat(chatManager.activeId);
                    this._recreateIcons();
                });
                document.getElementById('dropdownRename').addEventListener('click', () => {
                    const id = this._dropdownTargetId;
                    if (!id) return;
                    const chat = chatManager.getChat(id);
                    if (chat) {
                        this.closeDropdown();
                        this.openRenameModal(id, chatManager.getTitle(chat));
                    }
                });
                document.getElementById('dropdownDelete').addEventListener('click', () => {
                    const id = this._dropdownTargetId;
                    if (!id) return;
                    const chat = chatManager.getChat(id);
                    if (chat) {
                        this.closeDropdown();
                        this.openDeleteModal(id, chatManager.getTitle(chat));
                    }
                });

                this.sendBtn.addEventListener('click', () => this.sendMessage());
                this.input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                this.input.addEventListener('input', () => {
                    this.sendBtn.disabled = !this.input.value.trim();
                    this.input.style.height = 'auto';
                    this.input.style.height = this.input.scrollHeight + 'px';
                });
                this.sendBtn.disabled = true;

                document.getElementById('themeToggle').addEventListener('click', () => {
                    const isDark = document.body.classList.contains('theme-dark');
                    applyTheme(isDark ? 'light' : 'dark');
                });

                this.webSearchBtn.addEventListener('click', () => {
                    if (imageModeEnabled) return;
                    webSearchEnabled = !webSearchEnabled;
                    this.webSearchBtn.classList.toggle('active', webSearchEnabled);
                    this.webSearchBtn.title = webSearchEnabled ? 'Web Search ON' : 'Web Search OFF';
                    this._recreateIcons();
                });

                this.imageToggleBtn.addEventListener('click', () => {
                    imageModeEnabled = !imageModeEnabled;
                    this.imageToggleBtn.classList.toggle('active', imageModeEnabled);
                    this.imageToggleBtn.title = imageModeEnabled ? 'Image Mode ON' : 'Image Mode OFF';
                    if (imageModeEnabled) {
                        webSearchEnabled = false;
                        this.webSearchBtn.classList.remove('active');
                        this.webSearchBtn.title = 'Web Search (disabled)';
                        this.webSearchBtn.disabled = true;
                    } else {
                        this.webSearchBtn.disabled = false;
                        this.webSearchBtn.title = webSearchEnabled ? 'Web Search ON' : 'Web Search OFF';
                    }
                    this._recreateIcons();
                });

                document.addEventListener('keydown', (e) => {
                    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                        e.preventDefault();
                        this.toggleSidebar();
                    }
                    if (e.key === 'Escape') {
                        this.closeSidebar();
                        this.closeDropdown();
                        this.closeModal();
                    }
                });
            },

            _recreateIcons() {
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            },

            // ---- Sidebar ----
            openSidebar() {
                this.sidebar.classList.add('open');
                this.overlay.classList.add('open');
                document.body.style.overflow = 'hidden';
                this.render();
                this._recreateIcons();
            },
            closeSidebar() {
                this.sidebar.classList.remove('open');
                this.overlay.classList.remove('open');
                document.body.style.overflow = '';
                this.closeDropdown();
            },
            toggleSidebar() {
                if (this.sidebar.classList.contains('open')) this.closeSidebar();
                else this.openSidebar();
            },

            // ---- Dropdown ----
            openDropdown(chatId, btnElement) {
                this.closeDropdown();
                this._dropdownTargetId = chatId;
                const rect = btnElement.getBoundingClientRect();
                const dropdown = this.dropdown;
                const chat = chatManager.getChat(chatId);
                if (chat) {
                    const pinLabel = chat.pinned ? 'Unpin' : 'Pin';
                    document.getElementById('dropdownPin').innerHTML =
                        `<i data-lucide="${chat.pinned ? 'pin-off' : 'pin'}" class="lucide" style="width:20px;height:20px;stroke-width:1.8;"></i> ${pinLabel}`;
                }
                dropdown.style.left = Math.min(rect.left - 140 + rect.width, window.innerWidth - 170) + 'px';
                dropdown.style.top = (rect.bottom + 8) + 'px';
                dropdown.classList.add('open');
                this._recreateIcons();
            },
            closeDropdown() {
                this.dropdown.classList.remove('open');
                this._dropdownTargetId = null;
            },

            // ---- Modal ----
            openModal(title, message, confirmText, isDanger, callback) {
                this.modalTitle.textContent = title;
                this.modalMessage.textContent = message;
                this.modalInput.classList.add('hidden');
                this.modalConfirm.textContent = confirmText || 'Confirm';
                this.modalConfirm.className = isDanger ? 'btn-danger' : 'btn-primary';
                this.modalOverlay.classList.add('open');
                this._modalCallback = callback || null;
            },
            openRenameModal(chatId, currentTitle) {
                this.modalTitle.textContent = 'Rename Chat';
                this.modalMessage.textContent = 'Enter a new name for this chat:';
                this.modalInput.classList.remove('hidden');
                this.modalInput.value = currentTitle;
                this.modalInput.select();
                this.modalConfirm.textContent = 'Save';
                this.modalConfirm.className = 'btn-primary';
                this.modalOverlay.classList.add('open');
                this._modalCallback = (value) => {
                    if (value && value.trim()) {
                        chatManager.renameChat(chatId, value.trim());
                        this.render();
                        this.renderChat(chatManager.activeId);
                        this._recreateIcons();
                    }
                };
                setTimeout(() => this.modalInput.focus(), 50);
            },
            openDeleteModal(chatId, chatTitle) {
                this.openModal(
                    'Delete Chat',
                    `Are you sure you want to delete "${chatTitle}"? This cannot be undone.`,
                    'Delete',
                    true,
                    () => {
                        chatManager.deleteChat(chatId);
                        this.render();
                        this.renderChat(chatManager.activeId);
                        this._recreateIcons();
                    }
                );
            },
            closeModal() {
                this.modalOverlay.classList.remove('open');
                this._modalCallback = null;
            },
            _handleModalConfirm() {
                const cb = this._modalCallback;
                const inputVal = this.modalInput.value;
                if (cb) {
                    if (!this.modalInput.classList.contains('hidden')) cb(inputVal);
                    else cb(true);
                }
                this.closeModal();
            },

            // ---- Chat rendering ----
            render() {
                this._renderChatList();
                document.querySelectorAll('.chat-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.chatId === chatManager.activeId);
                });
                this._recreateIcons();
            },

            _renderChatList() {
                const container = this.chatList;
                const sorted = chatManager.getSortedChats();
                if (sorted.length === 0) {
                    container.innerHTML =
                        `<div class="chat-list-empty">No chats yet.<br>Click "New Chat" to start.</div>`;
                    return;
                }
                let html = '';
                sorted.forEach(chat => {
                    const title = chatManager.getTitle(chat);
                    const preview = chatManager.getPreview(chat);
                    const isActive = chat.id === chatManager.activeId;
                    const pinIcon = chat.pinned ?
                        `<i data-lucide="pin" class="pin-icon lucide" style="width:14px;height:14px;stroke-width:2;"></i>` :
                        '';
                    html += `
                        <div class="chat-item ${isActive ? 'active' : ''}" data-chat-id="${chat.id}">
                            <div class="chat-info">
                                <div class="chat-title">${this._escapeHtml(title)}</div>
                                <div class="chat-meta">
                                    ${pinIcon}
                                    <span>${this._escapeHtml(preview)}</span>
                                </div>
                            </div>
                            <button class="chat-menu-btn" data-chat-id="${chat.id}" aria-label="Chat menu">
                                <i data-lucide="more-vertical" class="lucide" style="width:20px;height:20px;stroke-width:1.8;"></i>
                            </button>
                        </div>
                    `;
                });
                container.innerHTML = html;

                container.querySelectorAll('.chat-item').forEach(el => {
                    const id = el.dataset.chatId;
                    el.addEventListener('click', (e) => {
                        if (e.target.closest('.chat-menu-btn')) return;
                        if (id) {
                            chatManager.switchTo(id);
                            this.render();
                            this.renderChat(id);
                            this.closeSidebar();
                            this.input.focus();
                            this._recreateIcons();
                        }
                    });
                    const menuBtn = el.querySelector('.chat-menu-btn');
                    if (menuBtn) {
                        menuBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const cid = menuBtn.dataset.chatId || id;
                            if (cid) this.openDropdown(cid, menuBtn);
                        });
                    }
                });
                this._recreateIcons();
            },

            renderChat(chatId) {
                const container = this.chatContainer;
                const chat = chatManager.getChat(chatId);
                container.innerHTML = '';
                const welcomeEl = document.getElementById('welcomeMessage');
                if (welcomeEl) container.appendChild(welcomeEl);

                if (!chat || chat.messages.length === 0) {
                    if (welcomeEl) welcomeEl.style.display = 'flex';
                    this._recreateIcons();
                    return;
                }
                if (welcomeEl) welcomeEl.style.display = 'none';

                chat.messages.forEach(msg => {
                    this._addMessageToDOM(msg.role, msg.text, false);
                });
                container.scrollTop = container.scrollHeight;
                this._recreateIcons();
            },

            // ---- Add message to DOM ----
            _addMessageToDOM(role, text, isTyping) {
                const container = this.chatContainer;
                const welcomeEl = document.getElementById('welcomeMessage');

                if (welcomeEl && container.contains(welcomeEl) && (role === 'user' || role === 'assistant')) {
                    welcomeEl.style.display = 'none';
                }

                if (isTyping && role === 'assistant') {
                    this._removeTypingIndicator();
                    const typingDiv = document.createElement('div');
                    typingDiv.className = 'message bot typing';
                    typingDiv.id = 'typingIndicator';
                    typingDiv.innerHTML = `
                        <div class="typing-indicator">
                            <div class="typing-spinner">
                                <i data-lucide="loader-circle" class="lucide" style="width:24px;height:24px;stroke-width:2;"></i>
                            </div>
                            <span class="typing-text">Aariz is thinking</span>
                        </div>
                    `;
                    container.appendChild(typingDiv);
                    this._typingId = 'typingIndicator';
                    container.scrollTop = container.scrollHeight;
                    this._recreateIcons();
                    return typingDiv;
                }

                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${role === 'assistant' ? 'bot' : role}`;

                if (role === 'assistant') {
                    const renderedHtml = renderMarkdown(text);
                    messageDiv.innerHTML = renderedHtml;
                    setTimeout(() => {
                        this._recreateIcons();
                    }, 0);
                } else {
                    messageDiv.textContent = text;
                }

                container.appendChild(messageDiv);
                container.scrollTop = container.scrollHeight;
                this._recreateIcons();
                return messageDiv;
            },

            _removeTypingIndicator() {
                const el = document.getElementById('typingIndicator');
                if (el) {
                    el.remove();
                    this._typingId = null;
                }
            },

            // ---- New Chat ----
            newChat() {
                if (chatManager.chats.length >= MAX_CHATS) {
                    this.showError(`Maximum ${MAX_CHATS} chats allowed. Delete one to create a new chat.`);
                    return;
                }
                const chat = chatManager.createChat('New Chat');
                if (chat) {
                    this.render();
                    this.renderChat(chat.id);
                    this.input.focus();
                    this._recreateIcons();
                    setTimeout(() => {
                        this.openRenameModal(chat.id, 'New Chat');
                    }, 200);
                }
            },

            // ---- Send Message ----
            async sendMessage() {
                const input = this.input;
                const text = input.value.trim();
                if (!text) return;

                const active = chatManager.getActive();
                if (!active) {
                    this.showError('No active chat. Create a new chat first.');
                    return;
                }

                input.value = '';
                input.style.height = 'auto';
                this.sendBtn.disabled = true;

                this._addMessageToDOM('user', text, false);
                chatManager.addMessage(active.id, 'user', text);
                this.render();

                if (imageModeEnabled) {
                    this._addMessageToDOM('assistant', '', true);
                    try {
                        const enhanced = await this._getEnhancedPrompt(text);
                        this._removeTypingIndicator();
                        this._addMessageToDOM('assistant', '', true);
                        const imageUrl =
                            `https://flux.gtech-apiz.workers.dev/?apikey=Suhail&text=${encodeURIComponent(enhanced)}`;
                        const finalMessage = `Here is image:\n\n![Generated Image](${imageUrl})`;
                        this._removeTypingIndicator();
                        this._addMessageToDOM('assistant', finalMessage, false);
                        chatManager.addMessage(active.id, 'assistant', finalMessage);
                    } catch (err) {
                        this._removeTypingIndicator();
                        const errMsg = this._friendlyError(err);
                        this._addMessageToDOM('assistant', errMsg, false);
                        chatManager.addMessage(active.id, 'assistant', errMsg);
                        this.showError(err.message);
                    } finally {
                        this.sendBtn.disabled = false;
                        setTimeout(() => input.focus(), 100);
                        this.render();
                        this._recreateIcons();
                    }
                } else {
                    this._addMessageToDOM('assistant', '', true);
                    try {
                        const response = await this._callAPI(text, active.id);
                        this._removeTypingIndicator();
                        this._addMessageToDOM('assistant', response, false);
                        chatManager.addMessage(active.id, 'assistant', response);
                    } catch (err) {
                        this._removeTypingIndicator();
                        const errMsg = this._friendlyError(err);
                        this._addMessageToDOM('assistant', errMsg, false);
                        chatManager.addMessage(active.id, 'assistant', errMsg);
                        this.showError(err.message);
                    } finally {
                        this.sendBtn.disabled = false;
                        setTimeout(() => input.focus(), 100);
                        this.render();
                        this._recreateIcons();
                    }
                }
            },

            async _getEnhancedPrompt(userPrompt) {
                const instruction =
                    `Enhance this prompt for image generation. Return ONLY the enhanced prompt, with no additional text, no markdown, no code fences, no explanations: ${userPrompt}`;
                const response = await this._callAPI(instruction, null, true);
                return response.trim();
            },

            async _callAPI(userMessage, chatId, skipHistory = false) {
                let history = [];
                if (!skipHistory && chatId) {
                    const chat = chatManager.getChat(chatId);
                    if (chat) {
                        const recent = chat.messages.slice(-8);
                        history = recent.map(msg => ({
                            role: msg.role === 'assistant' ? 'model' : 'user',
                            content: msg.text
                        }));
                    }
                }
                const payload = {
                    prompt: userMessage,
                    web_search: webSearchEnabled,
                    history: history,
                };
                const resp = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!resp.ok) {
                    let err = `Worker error: ${resp.status}`;
                    if (resp.status === 401) err = 'Unauthorized - check your worker';
                    if (resp.status === 429) err = 'Rate limit exceeded';
                    if (resp.status >= 500) err = 'Worker server error';
                    throw new Error(err);
                }
                return await resp.text();
            },

            _friendlyError(err) {
                const msg = err.message || '';
                if (msg.includes('401')) return 'Authentication failed. Please check your worker.';
                if (msg.includes('429')) return 'Rate limit reached. Please try again later.';
                if (msg.includes('network')) return 'Network error. Please check your connection.';
                return `I encountered an error: ${msg}`;
            },

            showError(msg) {
                const el = this.error;
                el.textContent = msg;
                el.classList.remove('hidden');
                clearTimeout(this._errorTimer);
                this._errorTimer = setTimeout(() => el.classList.add('hidden'), 5000);
            },

            _escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },
        };

        // ================================================================
        //  MARKDOWN RENDERER (updated with new code block layout)
        // ================================================================
        function renderMarkdown(text) {
            if (!text || typeof text !== 'string') return '';

            let processedText = text;
            const codeBlocks = [];
            const inlineCodeBlocks = [];

            processedText = processedText.replace(/```(\w+)?\n([\s\S]*?)```/g, function(match, language, code) {
                const id = 'code-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                const lang = language || 'text';
                const escapedCode = escapeHtml(code);

                let langLabel;
                if (lang === 'js' || lang === 'javascript') {
                    langLabel = `
                        <span class="lang-label">
                            <span class="terminal-icon-box">
                                <i data-lucide="terminal" class="lucide"></i>
                            </span>
                            JavaScript
                        </span>
                    `;
                } else {
                    langLabel = `<span class="lang-label">${lang}</span>`;
                }

                let buttonsHtml = '';
                if (lang === 'js' || lang === 'javascript') {
                    buttonsHtml += `
                        <button class="run-js-btn" data-code-id="${id}" title="Run this JavaScript code">
                            <i data-lucide="play" class="lucide"></i>
                        </button>
                    `;
                }
                buttonsHtml += `
                    <button class="copy-code-btn" data-code-id="${id}" title="Copy code">
                        <i data-lucide="copy" class="lucide"></i>
                    </button>
                `;

                const html = `
                    <div class="code-block" data-lang="${lang}">
                        <div class="code-block-header">
                            <span>${langLabel}</span>
                            <span class="action-buttons">${buttonsHtml}</span>
                        </div>
                        <pre><code id="${id}" class="language-${lang}">${escapedCode}</code></pre>
                        ${(lang === 'js' || lang === 'javascript') ? `<div class="js-output" id="output-${id}" style="display:none;"></div>` : ''}
                    </div>`;
                codeBlocks.push({ id, html, rawCode: code });
                return `__CODE_BLOCK_${codeBlocks.length - 1}__`;
            });

            processedText = processedText.replace(/`([^`]+)`/g, function(match, code) {
                const id = 'inline-code-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                inlineCodeBlocks.push({ id, code });
                return `__INLINE_CODE_${inlineCodeBlocks.length - 1}__`;
            });

            processedText = processedText.replace(/(?:\|.*\|.*\n)(?:\|?:?-+:?\|.*\n)+(?:\|.*\|.*\n)+/g, function(
            match) {
                const rows = match.trim().split('\n').filter(row => row.trim());
                if (rows.length < 2) return match;
                let tableHtml = '<table>\n<thead>\n<tr>\n';
                const headerRow = rows[0].trim();
                const headers = headerRow.split('|').filter(cell => cell.trim() !== '').map(cell => cell.trim());
                headers.forEach(header => {
                    tableHtml += `<th>${processMarkdownInCell(header)}</th>\n`;
                });
                tableHtml += '</tr>\n</thead>\n<tbody>\n';
                for (let i = 2; i < rows.length; i++) {
                    const row = rows[i].trim();
                    if (row.includes('---') || row.includes('===')) continue;
                    const cells = row.split('|').filter(cell => cell.trim() !== '').map(cell => cell.trim());
                    if (cells.length > 0) {
                        tableHtml += '<tr>\n';
                        cells.forEach(cell => {
                            tableHtml += `<td>${processMarkdownInCell(cell)}</td>\n`;
                        });
                        tableHtml += '</tr>\n';
                    }
                }
                tableHtml += '</tbody>\n</table>';
                return tableHtml;
            });

            processedText = processedText.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(match, alt, url) {
                return `<img src="${escapeHtml(url)}" alt="${escapeHtml(alt)}" style="max-width:100%; border-radius:16px; margin:8px 0; box-shadow: var(--md-elevation-level1);" />`;
            });

            processedText = processBasicMarkdown(processedText);
            processedText = processLists(processedText);

            inlineCodeBlocks.forEach((block, index) => {
                processedText = processedText.replace(
                    `__INLINE_CODE_${index}__`,
                    `<code>${escapeHtml(block.code)}</code>`
                );
            });
            codeBlocks.forEach((block, index) => {
                processedText = processedText.replace(`__CODE_BLOCK_${index}__`, block.html);
            });

            processedText = processParagraphs(processedText);
            return processedText;
        }

        function processMarkdownInCell(text) {
            if (!text) return '';
            let processed = text;
            processed = processed.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            processed = processed.replace(/\*(.*?)\*/g, '<em>$1</em>');
            processed = processed.replace(/`([^`]+)`/g, '<code>$1</code>');
            processed = processed.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            processed = escapeHtml(processed);
            processed = processed.replace(/&lt;(\/?)(strong|em|code|a\b[^&]*?)&gt;/g, '<$1$2>');
            return processed;
        }

        function processBasicMarkdown(text) {
            let processed = text;
            processed = processed.replace(/^### (.*$)/gm, '<h3>$1</h3>');
            processed = processed.replace(/^## (.*$)/gm, '<h2>$1</h2>');
            processed = processed.replace(/^# (.*$)/gm, '<h1>$1</h1>');
            processed = processed.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            processed = processed.replace(/\*(.*?)\*/g, '<em>$1</em>');
            processed = processed.replace(/^>\s*(.+)$/gm, '<blockquote>$1</blockquote>');
            processed = processed.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            return processed;
        }

        function processLists(text) {
            const lines = text.split('\n');
            let resultLines = [];
            let inList = false;
            let listType = 'ul';
            let listItems = [];
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                if (line.match(/^\s*[-*+]\s+/)) {
                    if (!inList) { inList = true;
                        listType = 'ul'; }
                    const content = line.replace(/^\s*[-*+]\s+/, '');
                    listItems.push(`<li>${content}</li>`);
                } else if (line.match(/^\s*\d+\.\s+/)) {
                    if (!inList) { inList = true;
                        listType = 'ol'; }
                    const content = line.replace(/^\s*\d+\.\s+/, '');
                    listItems.push(`<li>${content}</li>`);
                } else {
                    if (inList && listItems.length > 0) {
                        resultLines.push(`<${listType}>${listItems.join('')}</${listType}>`);
                        inList = false;
                        listItems = [];
                    }
                    resultLines.push(line);
                }
            }
            if (inList && listItems.length > 0) {
                resultLines.push(`<${listType}>${listItems.join('')}</${listType}>`);
            }
            return resultLines.join('\n');
        }

        function processParagraphs(text) {
            const lines = text.split('\n');
            const resultLines = [];
            let currentParagraph = [];
            for (const line of lines) {
                const trimmedLine = line.trim();
                if (trimmedLine === '') {
                    if (currentParagraph.length > 0) {
                        resultLines.push(`<p>${currentParagraph.join('<br>')}</p>`);
                        currentParagraph = [];
                    }
                } else if (line.startsWith('<') && (line.endsWith('>') || line.includes('</'))) {
                    if (currentParagraph.length > 0) {
                        resultLines.push(`<p>${currentParagraph.join('<br>')}</p>`);
                        currentParagraph = [];
                    }
                    resultLines.push(line);
                } else {
                    currentParagraph.push(line);
                }
            }
            if (currentParagraph.length > 0) {
                resultLines.push(`<p>${currentParagraph.join('<br>')}</p>`);
            }
            return resultLines.join('\n');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ================================================================
        //  RUN JAVASCRIPT BUTTON HANDLER (supports both console.log and return)
        // ================================================================
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.run-js-btn');
            if (!btn) return;

            const codeId = btn.getAttribute('data-code-id');
            const codeEl = document.getElementById(codeId);
            const outputEl = document.getElementById(`output-${codeId}`);
            if (!codeEl || !outputEl) return;

            const code = codeEl.textContent;
            outputEl.style.display = 'block';
            outputEl.innerHTML = '';

            let output = '';
            const originalLog = console.log;
            console.log = (...args) => {
                output += args.map(arg =>
                    typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                ).join(' ') + '\n';
            };

            let result;
            let error = null;
            try {
                result = new Function(code)();
            } catch (err) {
                error = err;
            } finally {
                console.log = originalLog;
            }

            if (error) {
                outputEl.innerHTML = `<strong style="color:var(--md-sys-color-error);">Error:</strong><br><pre>${escapeHtml(error.message)}</pre>`;
                return;
            }

            if (output) {
                const pre = document.createElement('pre');
                pre.textContent = output;
                outputEl.appendChild(document.createTextNode('Output:\n'));
                outputEl.appendChild(pre);
            }

            if (result !== undefined) {
                const pre = document.createElement('pre');
                pre.textContent = JSON.stringify(result, null, 2);
                if (output) outputEl.appendChild(document.createElement('hr'));
                outputEl.appendChild(document.createTextNode('Return value:\n'));
                outputEl.appendChild(pre);
            }

            if (!output && result === undefined) {
                outputEl.innerHTML = `ℹ️ Code executed successfully but no output was produced. Use <code>console.log()</code> to display results.`;
            }
        });

        // Copy code buttons
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.copy-code-btn');
            if (!btn) return;
            const codeId = btn.getAttribute('data-code-id');
            if (!codeId) return;
            const codeEl = document.getElementById(codeId);
            if (!codeEl) return;
            const text = codeEl.textContent;
            navigator.clipboard.writeText(text).then(() => {
                btn.innerHTML = `<i data-lucide="check" class="lucide"></i>`;
                btn.classList.add('copied');
                if (typeof lucide !== 'undefined') lucide.createIcons();
                setTimeout(() => {
                    btn.innerHTML = `<i data-lucide="copy" class="lucide"></i>`;
                    btn.classList.remove('copied');
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }, 2000);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (e) {}
                document.body.removeChild(ta);
                btn.innerHTML = `<i data-lucide="check" class="lucide"></i>`;
                btn.classList.add('copied');
                if (typeof lucide !== 'undefined') lucide.createIcons();
                setTimeout(() => {
                    btn.innerHTML = `<i data-lucide="copy" class="lucide"></i>`;
                    btn.classList.remove('copied');
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }, 2000);
            });
        });

        // ================================================================
        //  THEME
        // ================================================================
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        let currentTheme = localStorage.getItem('endroid-theme') || 'system';

        function applyTheme(theme) {
            document.body.classList.remove('theme-light', 'theme-dark');
            const icon = document.getElementById('themeIcon');
            if (theme === 'dark' || (theme === 'system' && prefersDark.matches)) {
                document.body.classList.add('theme-dark');
                if (icon) {
                    icon.setAttribute('data-lucide', 'sun');
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }
            } else {
                document.body.classList.add('theme-light');
                if (icon) {
                    icon.setAttribute('data-lucide', 'moon');
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }
            }
            currentTheme = theme;
            localStorage.setItem('endroid-theme', theme);
        }
        applyTheme(currentTheme);
        prefersDark.addEventListener('change', () => {
            if (currentTheme === 'system') applyTheme('system');
        });

        // ================================================================
        //  GLOBALS
        // ================================================================
        const WORKER_URL = 'https://ai.endroid.workers.dev/api/v1/';
        let webSearchEnabled = false;
        let imageModeEnabled = false;

        // ================================================================
        //  INIT
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            chatManager.init();
            UI.init();
            UI.renderChat(chatManager.activeId);
            UI.input.focus();
            if (typeof lucide !== 'undefined') lucide.createIcons();

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js')
                        .then(reg => console.log('SW registered:', reg.scope))
                        .catch(err => console.error('SW registration failed:', err));
                });
            }
            let deferredPrompt;
            const installBanner = document.getElementById('installBanner');
            const installBtn = document.getElementById('installBtn');
            const dismissBtn = document.getElementById('dismissInstall');
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                if (installBanner) installBanner.classList.remove('hidden');
            });
            if (installBtn) {
                installBtn.addEventListener('click', () => {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        deferredPrompt.userChoice.then((choiceResult) => {
                            if (choiceResult.outcome === 'accepted') console.log('User installed');
                            deferredPrompt = null;
                            if (installBanner) installBanner.classList.add('hidden');
                        });
                    }
                });
            }
            if (dismissBtn) {
                dismissBtn.addEventListener('click', () => {
                    if (installBanner) installBanner.classList.add('hidden');
                });
            }

            window.testMarkdown = function() {
                const test = `# Markdown Test\n\n**Bold** and *italic*.\n\n- Item 1\n- Item 2\n\n\`\`\`js\nconsole.log('Hello from JS!');\nconst sum = 2 + 2;\nsum;\n\`\`\``;
                UI._addMessageToDOM('assistant', test, false);
                const active = chatManager.getActive();
                if (active) chatManager.addMessage(active.id, 'assistant', test);
                if (typeof lucide !== 'undefined') lucide.createIcons();
            };
        });
    </script>
</body>
