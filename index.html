    <style>
        :root {
            --md-sys-color-primary: #3B6939;
            --md-sys-color-on-primary: #FFFFFF;

            --md-sys-color-surface-container-low: #F1F5EC;

            --md-sys-color-on-surface-variant: #424940;

            --md-sys-color-outline: #72796F;

            --md-sys-color-error-container: #FFDAD6;
            --md-sys-color-on-error-container: #93000A;

            --md-sys-color-scrim: #000000;

            --md-elevation-level1: 0 1px 3px 0 rgba(0,0,0,0.12);
            --md-elevation-level2: 0 3px 6px rgba(0,0,0,0.16);
            --md-elevation-level3: 0 10px 20px rgba(0,0,0,0.19);

            --md-ref-typeface-brand: 'Roboto', system-ui, sans-serif;
            --md-ref-typeface-plain: 'Roboto', system-ui, sans-serif;
            --md-ref-typeface-mono: 'Roboto Mono', monospace;

            --glass-background-light: rgba(255, 255, 255, 0.7);
            --glass-background-dark: rgba(30, 30, 35, 0.7);
            --glass-backdrop-blur: blur(20px);

            --motion-easing-emphasized: cubic-bezier(0.2, 0.0, 0.0, 1.0);
            --motion-duration-medium: 300ms;

            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --md-sys-color-primary: #A1D39A;
                --md-sys-color-on-primary: #0A390F;

                --md-sys-color-tertiary-container: #1F4D52;

                --md-sys-color-surface: #10140F;
                --md-sys-color-surface-dim: #10140F;
                --md-sys-color-surface-bright: #363A34;
                --md-sys-color-surface-container: #1D211B;
                --md-sys-color-surface-container-high: #272B25;
                --md-sys-color-surface-container-highest: #323630;
                --md-sys-color-surface-container-low: #191D17;
                --md-sys-color-surface-container-lowest: #0B0F0A;

                --md-sys-color-on-surface: #E0E4DB;
                --md-sys-color-on-surface-variant: #C2C9BD;

                --md-sys-color-outline: #8C9388;
                --md-sys-color-outline-variant: #424940;

                --md-sys-color-inverse-surface: #E0E4DB;
                --md-sys-color-inverse-on-surface: #2D322C;

                --md-sys-color-error: #FFB4AB;
                --md-sys-color-on-error: #690005;
                --md-sys-color-error-container: #93000A;
                --md-sys-color-on-error-container: #FFDAD6;

                --md-sys-color-scrim: #000000;

                --md-elevation-level1: 0 1px 3px 0 rgba(0,0,0,0.4);
                --md-elevation-level2: 0 3px 6px rgba(0,0,0,0.5);
                --md-elevation-level3: 0 10px 20px rgba(0,0,0,0.6);

                color-scheme: dark;
            }
        }

        }

        .theme-light {
            --md-sys-color-primary: #3B6939;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #BCF0B4;
            --md-sys-color-on-primary-container: #235024;

            --md-sys-color-secondary-container: #D5E8CF;

            --md-sys-color-tertiary: #38656A;
            --md-sys-color-on-tertiary: #FFFFFF;
            --md-sys-color-tertiary-container: #BCEBF0;
            --md-sys-color-on-tertiary-container: #1F4D52;

            --md-sys-color-surface: #F7FBF1;
            --md-sys-color-surface-dim: #D8DBD2;
            --md-sys-color-surface-bright: #F7FBF1;
            --md-sys-color-surface-container: #ECEFE6;
            --md-sys-color-surface-container-high: #E6E9E0;
            --md-sys-color-surface-container-highest: #E0E4DB;
            --md-sys-color-surface-container-low: #F1F5EC;
            --md-sys-color-surface-container-lowest: #FFFFFF;

            --md-sys-color-on-surface: #191D17;
            --md-sys-color-on-surface-variant: #424940;

            --md-sys-color-outline: #72796F;
            --md-sys-color-outline-variant: #C2C9BD;

            --md-sys-color-inverse-surface: #2D322C;
            --md-sys-color-inverse-on-surface: #EFF2E9;

            --md-sys-color-error: #BA1A1A;
            --md-sys-color-on-error: #FFFFFF;
            --md-sys-color-error-container: #FFDAD6;
            --md-sys-color-on-error-container: #93000A;

            --md-sys-color-scrim: #000000;

            --md-elevation-level1: 0 1px 3px 0 rgba(0,0,0,0.12);
            --md-elevation-level2: 0 3px 6px rgba(0,0,0,0.16);
            --md-elevation-level3: 0 10px 20px rgba(0,0,0,0.19);

            color-scheme: light;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--md-ref-typeface-plain);
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            height: 100vh;
            max-width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color var(--motion-duration-medium) var(--motion-easing-emphasized);
        }

        .header {
            padding: 12px 16px;
            font-family: var(--md-ref-typeface-brand);
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--md-sys-color-primary);
            background: var(--md-sys-color-surface-container);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: var(--glass-backdrop-blur);
            -webkit-backdrop-filter: var(--glass-backdrop-blur);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            transition: all var(--motion-duration-medium) var(--motion-easing-emphasized);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .logo-icon {
            font-size: 1.8rem;
            color: var(--md-sys-color-primary);
            width: 1.8rem;
            height: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header .logo-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .header-title {
            font-weight: 500;
        }

        .theme-toggle {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--motion-duration-medium) var(--motion-easing-emphasized);
            box-shadow: var(--md-elevation-level1);
        }

        .theme-toggle:hover {
            transform: scale(1.08) rotate(8deg);
            box-shadow: var(--md-elevation-level2);
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .theme-toggle .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            transition: transform var(--motion-duration-medium) var(--motion-easing-emphasized);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 16px 100px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            scroll-behavior: smooth;
        }

        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-logo {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            animation: logoSpin 12s linear infinite alternate, logoFadeIn 1s ease-out;
        }

        .welcome-logo svg {
            width: 100%;
            height: 100%;
        }

        @keyframes logoSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes logoFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .welcome-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--md-sys-color-primary), var(--md-sys-color-primary-container));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            font-size: 1.1rem;
            color: var(--md-sys-color-on-surface-variant);
            max-width: 300px;
            line-height: 1.5;
        }

        .message {
            margin: 8px 0;
            padding: 16px 20px;
            border-radius: 24px;
            max-width: 85%;
            font-size: 1rem;
            line-height: 1.5;
            word-break: break-word;
            animation: messageSlideIn 0.3s var(--motion-easing-emphasized);
            position: relative;
            transition: transform 0.2s ease;
            border: 1px solid transparent;
        }

        .message:hover {
            transform: translateY(-2px);
        }

        @keyframes messageSlideIn {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .message.user {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            align-self: flex-end;
            border-bottom-right-radius: 8px;
            border-top-right-radius: 24px;
            border-top-left-radius: 24px;
            border-bottom-left-radius: 24px;
            box-shadow: var(--md-elevation-level1);
            margin-left: auto;
            border: 1px solid color-mix(in srgb, var(--md-sys-color-primary) 20%, transparent);
        }

        .message.bot {
            background: color-mix(in srgb, var(--md-sys-color-surface-container) 85%, transparent);
            color: var(--md-sys-color-on-surface);
            align-self: flex-start;
            border-bottom-left-radius: 8px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            border-bottom-right-radius: 24px;
            backdrop-filter: var(--glass-backdrop-blur);
            -webkit-backdrop-filter: var(--glass-backdrop-blur);
            box-shadow: var(--md-elevation-level1);
            border: 1px solid color-mix(in srgb, var(--md-sys-color-outline) 15%, transparent);
        }

        .message.typing {
            align-self: flex-start;
            background: color-mix(in srgb, var(--md-sys-color-surface-container) 85%, transparent);
            border: 1px solid color-mix(in srgb, var(--md-sys-color-outline) 15%, transparent);
            padding: 12px 20px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .typing-spinner {
            width: 24px;
            height: 24px;
            animation: spin 1.2s linear infinite;
        }
        
        .typing-spinner svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .typing-text {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 0.95rem;
        }

        .message.bot p {
            margin-bottom: 1em;
            line-height: 1.6;
        }

        .message.bot p:last-child {
            margin-bottom: 0;
        }

        .message.bot h1,
        .message.bot h2,
        .message.bot h3,
        .message.bot h4,
        .message.bot h5,
        .message.bot h6 {
            margin-top: 1.2em;
            margin-bottom: 0.6em;
            font-weight: 600;
            line-height: 1.3;
            color: var(--md-sys-color-on-surface);
        }
        .message.bot h1 { font-size: 1.6em; border-bottom: 2px solid var(--md-sys-color-primary); padding-bottom: 0.3em; }
        .message.bot h2 { font-size: 1.4em; }
        .message.bot h3 { font-size: 1.2em; }
        .message.bot h4 { font-size: 1.1em; }
        .message.bot h5 { font-size: 1em; }
        .message.bot h6 { font-size: 0.95em; color: var(--md-sys-color-on-surface-variant); }

        .message.bot strong {
            font-weight: 700;
            color: color-mix(in srgb, var(--md-sys-color-on-surface) 90%, var(--md-sys-color-primary));
        }

        .message.bot em {
            font-style: italic;
            color: color-mix(in srgb, var(--md-sys-color-on-surface) 80%, var(--md-sys-color-primary));
        }

        .message.bot a {
            color: var(--md-sys-color-primary);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.2s;
        }
        .message.bot a:hover {
            color: color-mix(in srgb, var(--md-sys-color-primary) 80%, black);
        }

        .message.bot ul,
        .message.bot ol {
            padding-left: 1.8em;
            margin: 0.8em 0;
        }

        .message.bot li {

    <script>
        const WORKER_URL = 'https://ai.endroid.workers.dev/api/v1/';
        let conversationHistory = [];
        const MAX_HISTORY = 8;
        let typingIndicatorId = null;
        let webSearchEnabled = false;

        const SYSTEM_PROMPT = `You are Endroid Elyx, a helpful and friendly assistant powered by Gemini.
You remember conversation context and provide useful, accurate responses.
Be conversational and engaging in your replies.
CRITICAL FORMATTING RULES:
1. ALWAYS respond using PROPER MARKDOWN formatting, NOT HTML
2. Use **bold** for emphasis, NOT <strong> tags
3. Use *italic* for emphasis, NOT <em> tags
4. Use # for headings, NOT <h1> tags
5. Use - for bullet points, NOT <ul> or <li> tags
6. Use \`code\` for inline code and \`\`\`language\ncode\n\`\`\` for code blocks
7. Use markdown tables when comparing things
8. NEVER use HTML tags like <br>, <p>, <div>, or any other HTML
9. Format all responses in clean, readable markdown
10. You can use markdown inside table cells (like **bold**, *italic*, \`code\`)

You remember conversation context and provide useful, accurate responses.
Be conversational and engaging in your replies.`;

        function renderMarkdown(text) {
            if (!text || typeof text !== 'string') return '';
            
            let processedText = text;
            
            const codeBlocks = [];
            const inlineCodeBlocks = [];
            
            processedText = processedText.replace(/```(\w+)?\n([\s\S]*?)```/g, function(match, language, code) {
                const id = 'code-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                const lang = language || 'text';
                const escapedCode = escapeHtml(code);
                const html = `
                <div class="code-block">
                    <div class="code-block-header">
                        <span>${lang}</span>
                        <button class="copy-code-btn" data-code-id="${id}">
                            <span class="material-symbols-rounded" style="font-size:18px">content_copy</span>
                            Copy
                        </button>
                    </div>
                    <pre><code id="${id}" class="language-${lang}">${escapedCode}</code></pre>
                </div>`;
                codeBlocks.push({ id: id, html: html, rawCode: code });
                return `__CODE_BLOCK_${codeBlocks.length - 1}__`;
            });

            processedText = processedText.replace(/`([^`]+)`/g, function(match, code) {
                const id = 'inline-code-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                inlineCodeBlocks.push({ id: id, code: code });
                return `__INLINE_CODE_${inlineCodeBlocks.length - 1}__`;
            });

            processedText = processedText.replace(/(?:\|.*\|.*\n)(?:\|?:?-+:?\|.*\n)+(?:\|.*\|.*\n)+/g, function(match) {
                const rows = match.trim().split('\n').filter(row => row.trim());
                if (rows.length < 2) return match;
                
                let tableHtml = '<table>\n<thead>\n<tr>\n';
                const headerRow = rows[0].trim();
                const headers = headerRow.split('|').filter(cell => cell.trim() !== '').map(cell => cell.trim());
                headers.forEach(header => {
                    let headerContent = processMarkdownInCell(header);
                    tableHtml += `<th>${headerContent}</th>\n`;
                });
                tableHtml += '</tr>\n</thead>\n<tbody>\n';
                
                for (let i = 2; i < rows.length; i++) {
                    const row = rows[i].trim();
                    if (row.includes('---') || row.includes('===')) continue;
                    const cells = row.split('|').filter(cell => cell.trim() !== '').map(cell => cell.trim());
                    if (cells.length > 0) {
                        tableHtml += '<tr>\n';
                        cells.forEach(cell => {
                            let cellContent = processMarkdownInCell(cell);
                            tableHtml += `<td>${cellContent}</td>\n`;
                        });
                        tableHtml += '</tr>\n';
                    }
                }
                tableHtml += '</tbody>\n</table>';
                return tableHtml;
            });

            processedText = processBasicMarkdown(processedText);
            processedText = processLists(processedText);

            inlineCodeBlocks.forEach((block, index) => {
                processedText = processedText.replace(
                    `__INLINE_CODE_${index}__`, 
                    `<code>${escapeHtml(block.code)}</code>`
                );
            });

            codeBlocks.forEach((block, index) => {
                processedText = processedText.replace(`__CODE_BLOCK_${index}__`, block.html);
            });

            processedText = processParagraphs(processedText);

            return processedText;
        }

        function processMarkdownInCell(text) {
            if (!text) return '';
            let processed = text;
            processed = processed.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            processed = processed.replace(/\*(.*?)\*/g, '<em>$1</em>');
            processed = processed.replace(/`([^`]+)`/g, '<code>$1</code>');
            processed = processed.replace(/\[([^\]]+)\]\(([^)]+)\)/g, 
                '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            processed = escapeHtml(processed);
            processed = processed.replace(/&lt;(\/?)(strong|em|code|a\b[^&]*?)&gt;/g, '<$1$2>');
            return processed;
        }

        function processBasicMarkdown(text) {
            let processed = text;
            processed = processed.replace(/^### (.*$)/gm, '<h3>$1</h3>');
            processed = processed.replace(/^## (.*$)/gm, '<h2>$1</h2>');
            processed = processed.replace(/^# (.*$)/gm, '<h1>$1</h1>');
            processed = processed.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            processed = processed.replace(/\*(.*?)\*/g, '<em>$1</em>');
            processed = processed.replace(/^>\s*(.+)$/gm, '<blockquote>$1</blockquote>');
            processed = processed.replace(/\[([^\]]+)\]\(([^)]+)\)/g, 
                '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            return processed;
        }

        function processLists(text) {
            const lines = text.split('\n');
            let resultLines = [];
            let inList = false;
            let listType = 'ul';
            let listItems = [];
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                if (line.match(/^\s*[-*+]\s+/)) {
                    if (!inList) {
                        inList = true;
                        listType = 'ul';
                    }
                    const content = line.replace(/^\s*[-*+]\s+/, '');
                    listItems.push(`<li>${content}</li>`);
                } else if (line.match(/^\s*\d+\.\s+/)) {
                    if (!inList) {
                        inList = true;
                        listType = 'ol';
                    }
                    const content = line.replace(/^\s*\d+\.\s+/, '');
                    listItems.push(`<li>${content}</li>`);
                } else {
                    if (inList && listItems.length > 0) {
                        resultLines.push(`<${listType}>${listItems.join('')}</${listType}>`);
                        inList = false;
                        listItems = [];
                    }
                    resultLines.push(line);
                }
            }
            if (inList && listItems.length > 0) {
                resultLines.push(`<${listType}>${listItems.join('')}</${listType}>`);
            }
            return resultLines.join('\n');
        }

        function processParagraphs(text) {
            const lines = text.split('\n');
            const resultLines = [];
            let currentParagraph = [];
            
            for (const line of lines) {
                const trimmedLine = line.trim();
                if (trimmedLine === '') {
                    if (currentParagraph.length > 0) {
                        resultLines.push(`<p>${currentParagraph.join('<br>')}</p>`);
                        currentParagraph = [];
                    }
                } else if (line.startsWith('<') && (line.endsWith('>') || line.includes('</'))) {
                    if (currentParagraph.length > 0) {
                        resultLines.push(`<p>${currentParagraph.join('<br>')}</p>`);
                        currentParagraph = [];
                    }
                    resultLines.push(line);
                } else {
                    currentParagraph.push(line);
                }
            }
            if (currentParagraph.length > 0) {
                resultLines.push(`<p>${currentParagraph.join('<br>')}</p>`);
            }
            return resultLines.join('\n');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setupCopyButtons() {
            document.addEventListener('click', function(e) {
                if (e.target.closest('.copy-code-btn')) {
                    const button = e.target.closest('.copy-code-btn');
                    const codeId = button.getAttribute('data-code-id');
                    if (codeId) {
                        copyCodeToClipboard(codeId, button);
                    }
                }
            });
        }

        function copyCodeToClipboard(codeId, button) {
            const codeElement = document.getElementById(codeId);
            if (!codeElement) return;
            const text = codeElement.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = button.innerHTML;
                button.innerHTML = '<span class="material-symbols-rounded" style="font-size:18px">check</span>Copied!';
                button.classList.add('copied');
                setTimeout(() => {
                    button.innerHTML = originalHTML;
                    button.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    const originalHTML = button.innerHTML;
                    button.innerHTML = '<span class="material-symbols-rounded" style="font-size:18px">check</span>Copied!';
                    button.classList.add('copied');
                    setTimeout(() => {
                        button.innerHTML = originalHTML;
                        button.classList.remove('copied');
                    }, 2000);
                } catch (err) {
                    console.error('Fallback copy failed:', err);
                }
                document.body.removeChild(textArea);
            });
        }

                setTimeout(() => {
                    const copyButtons = messageDiv.querySelectorAll('.copy-code-btn');
                    copyButtons.forEach(button => {
                        if (!button.hasAttribute('data-code-id')) {
                            const codeId = button.closest('.code-block')?.querySelector('code')?.id;

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
                typingIndicatorId = null;
            }
        }

        function showErrorInUI(message) {
            const errorDiv = document.getElementById('error');
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.classList.remove('hidden');
                setTimeout(() => errorDiv.classList.add('hidden'), 5000);
            }
        }

        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
        let currentTheme = localStorage.getItem('endroid-theme') || 'system';

        function applyTheme(theme) {
            document.body.classList.remove('theme-light', 'theme-dark');
            if (theme === 'dark' || (theme === 'system' && prefersDarkScheme.matches)) {
                document.body.classList.add('theme-dark');
                themeIcon.textContent = 'light_mode';
            } else {
                document.body.classList.add('theme-light');
                themeIcon.textContent = 'dark_mode';
            }
            currentTheme = theme;
            localStorage.setItem('endroid-theme', theme);
        }

        applyTheme(currentTheme);

        themeToggle.addEventListener('click', () => {
            const newTheme = document.body.classList.contains('theme-dark') ? 'light' : 'dark';
            applyTheme(newTheme);
        });

        prefersDarkScheme.addEventListener('change', (e) => {
            if (currentTheme === 'system') {
                applyTheme('system');
            }
        });

        async function callWorkerAPI(userMessage) {
            const recentHistory = conversationHistory
                .filter(msg => msg.role === "user" || msg.role === "assistant")
                .slice(-MAX_HISTORY);
            const history = recentHistory.map(msg => ({
                role: msg.role === "assistant" ? "model" : "user",
                content: msg.text
            }));
            const payload = {
                prompt: userMessage,
                web_search: webSearchEnabled,
                history: history
            };
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    let errorMessage = `Worker error: ${response.status}`;
                    if (response.status === 401) errorMessage = "Unauthorized - check your worker";
                    if (response.status === 429) errorMessage = "Rate limit exceeded";
                    if (response.status >= 500) errorMessage = "Worker server error";
                    throw new Error(errorMessage);
                }
                const result = await response.text();
                return result;
            } catch (error) {
                console.error("Worker API Call Failed:", error);
                throw error;
            }
        }

        function addToHistory(role, text) {
            if (role === "user" || role === "assistant") {
                conversationHistory.push({ role, text });
                if (conversationHistory.length > MAX_HISTORY * 2) {
                    conversationHistory = conversationHistory.slice(-MAX_HISTORY * 2);
                }
                saveToStorage();
            }
        }

        function saveToStorage() {
            try {
                localStorage.setItem("endroid_conversation", JSON.stringify(conversationHistory));
            } catch (e) {
                console.warn("Could not save to localStorage:", e);
            }
        }

        function loadFromStorage() {
            try {
                const saved = localStorage.getItem("endroid_conversation");
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) {
                        conversationHistory = parsed;
                        const container = document.getElementById("chatContainer");
                        const welcomeEl = document.getElementById("welcomeMessage");
                        if (parsed.length > 0 && welcomeEl && container.contains(welcomeEl)) {
                            welcomeEl.style.display = 'none';
                        }
                        parsed.forEach(msg => {
                            if (msg.role === "assistant") {
                                addMessageToUI(msg.role, msg.text, false);
                            } else if (msg.role === "user") {
                                addMessageToUI(msg.role, msg.text, false);
                            }
                        });
                    }
                }
            } catch (e) {
                console.warn("Could not load from localStorage:", e);
                conversationHistory = [];
            }
        }

        function clearHistory() {
            if (confirm("Clear all chat history? This cannot be undone.")) {
                conversationHistory = [];
                localStorage.removeItem("endroid_conversation");
                const container = document.getElementById("chatContainer");
                const welcomeEl = document.getElementById("welcomeMessage");
                container.innerHTML = '';
                if (welcomeEl) {
                    welcomeEl.style.display = 'flex';
                    container.appendChild(welcomeEl);
                }
            }
        }

        function setupWebSearchToggle() {
            const btn = document.getElementById('webSearchToggle');
            if (!btn) return;
            btn.addEventListener('click', () => {
                webSearchEnabled = !webSearchEnabled;
                if (webSearchEnabled) {
                    btn.classList.add('active');
                    btn.title = "Web Search ON";
                } else {
                    btn.classList.remove('active');
                    btn.title = "Web Search OFF";
                }
            });
        }

        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const sendBtn = document.getElementById("sendBtn");
            if (!input || !sendBtn) return;
            const userMessage = input.value.trim();
            if (!userMessage) return;
            input.value = "";
            sendBtn.disabled = true;
            input.style.height = 'auto';
            addMessageToUI("user", userMessage, false);
            addToHistory("user", userMessage);
            addMessageToUI("assistant", "", true);
            try {
                const aiResponse = await callWorkerAPI(userMessage);
                removeTypingIndicator();
                addMessageToUI("assistant", aiResponse, false);
                addToHistory("assistant", aiResponse);
            } catch (error) {
                removeTypingIndicator();
                let userFriendlyError = "I encountered an error. ";
                if (error.message.includes("401")) {
                    userFriendlyError += "Authentication failed. Please check your worker.";
                } else if (error.message.includes("429")) {
                    userFriendlyError += "Rate limit reached. Please try again later.";
                } else if (error.message.includes("network")) {
                    userFriendlyError += "Network error. Please check your connection.";
                } else {
                    userFriendlyError += error.message;
                }
                addMessageToUI("assistant", userFriendlyError, false);
                showErrorInUI(error.message);
            } finally {
                sendBtn.disabled = false;
                setTimeout(() => { if (input) input.focus(); }, 100);
            }
        }

        function setupEventListeners() {
            const input = document.getElementById("messageInput");
            const sendBtn = document.getElementById("sendBtn");
            const clearBtn = document.getElementById("clearBtn");
            if (input) {
                input.addEventListener("keydown", function(e) {
                    if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                });
                input.addEventListener("input", function() {
                    if (sendBtn) sendBtn.disabled = !this.value.trim();
                    this.style.height = 'auto';
                    this.style.height = (this.scrollHeight) + 'px';
                });
                setTimeout(() => { if (input) input.focus(); }, 500);
            }
            if (sendBtn) {
                sendBtn.addEventListener("click", sendMessage);
                sendBtn.disabled = true;
            }
            if (clearBtn) {
                clearBtn.addEventListener("click", clearHistory);
            }
            setupWebSearchToggle();
        }

        function initializeApp() {
            setupCopyButtons();
            loadFromStorage();
            setupEventListeners();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.error('SW registration failed:', err));
            });
        }

        let deferredPrompt;
        const installBanner = document.getElementById('installBanner');
        const installBtn = document.getElementById('installBtn');
        const dismissBtn = document.getElementById('dismissInstall');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installBanner) installBanner.classList.remove('hidden');
        });

        if (installBtn) {
            installBtn.addEventListener('click', () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            console.log('User installed');
                        }
                        deferredPrompt = null;
                        if (installBanner) installBanner.classList.add('hidden');
                    });
                }
            });
        }

        if (dismissBtn) {
            dismissBtn.addEventListener('click', () => {
                if (installBanner) installBanner.classList.add('hidden');
            });
        }
    </script>
